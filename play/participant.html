<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="part.title">PlanProof — Participant</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./theme.css" />
<style>
  /* PlanProof look (player polish, 11 October 2026) — tokens in theme.css. */
  body { min-height: 100vh; }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px 24px; }
  /* The countdown stays at the top of the screen while the person scrolls
     down to type, so the time left is always in sight. */
  .clock-wrap { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; }
  /* Countdown digits never reverse in a right-to-left language. */
  #injectTimerValue { direction: ltr; unicode-bidi: isolate; }
  .inject-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 18px 20px; margin-bottom: 16px;
  }
  .inject-title { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; line-height: 1.25; margin-bottom: 8px; }
  .inject-desc { color: var(--text); margin-bottom: 14px; }
  .inject-task {
    background: var(--amber-dim); border-inline-start: 3px solid var(--amber);
    padding: 9px 12px; border-radius: 4px; font-size: 0.95rem;
  }
  .task-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag {
    font-size: 0.78rem; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border-strong); color: var(--text-muted);
  }
  .tag.individual { border-color: var(--amber); color: var(--amber); }
  .answer-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px;
  }
  .not-required {
    background: var(--blue-dim); border-inline-start: 3px solid var(--blue); color: var(--text);
    border-radius: 6px; padding: 10px 12px; font-size: 0.88rem; margin-bottom: 12px;
  }
  .hint { font-size: 0.82rem; color: var(--text-muted); margin: -2px 0 8px; }
  .answer-card textarea { min-height: 130px; resize: vertical; }
  .attachments { margin-top: 14px; }
  .attachment-list { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.88rem; }
  .attachment-list li {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 7px 10px; background: var(--panel-raised); border-radius: 6px; margin-bottom: 4px;
    overflow-wrap: anywhere;
  }
  .attachment-list button { border: none; background: none; color: var(--red-soft); cursor: pointer; font: inherit; font-size: 0.88rem; }
  .attachment-list button:disabled { opacity: 0.4; cursor: not-allowed; }
  input[type="file"] { margin-top: 4px; max-width: 100%; color: var(--text-muted); font: inherit; font-size: 0.88rem; }
  .save-status { font-size: 0.85rem; color: var(--text-muted); margin-top: 10px; min-height: 1.3em; }
  .row-buttons { display: flex; gap: 10px; margin-top: 14px; }
  .row-buttons .pp-btn { flex: 1; }
  .submitted-banner {
    background: var(--teal-dim); border: 1px solid var(--teal); color: #c9efe1; border-radius: 8px;
    padding: 10px 14px; font-size: 0.95rem; font-weight: 600; margin-top: 14px;
  }
  .edit-hint { margin-top: 8px; }
  /* Changing a submitted answer ("Edit answer", 11 October 2026). */
  .editing-note {
    background: var(--amber-dim); border: 1px solid var(--amber); border-radius: 8px;
    padding: 10px 14px; font-size: 0.9rem; margin-top: 14px;
  }
  .center-note { text-align: center; color: var(--text); padding: 72px 20px; font-size: 1.15rem; text-wrap: balance; }
  .center-note a { color: var(--amber); }

  /* Facilitator messages (added 5 October 2026). The banner and the list sit
     outside <main>, which is redrawn on every update. */
  .msg-banner { display: none; background: var(--amber); color: var(--amber-ink); }
  .msg-banner.show { display: block; }
  .msg-banner-inner {
    max-width: 640px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .msg-banner-inner > div { flex: 1; min-width: 0; }
  .msg-label { font-size: 0.8rem; font-weight: 600; opacity: 0.8; }
  .msg-text { font-size: 1.08rem; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
  .msg-banner button {
    flex: 0 0 auto; border: 1.5px solid var(--amber-ink); background: transparent; color: var(--amber-ink);
    border-radius: 8px; padding: 9px 13px; font: inherit; font-weight: 600; cursor: pointer; font-size: 0.92rem;
  }
  .msg-history { max-width: 640px; margin: 0 auto; padding: 0 16px 20px; }
  .msg-history summary { cursor: pointer; font-size: 0.95rem; padding: 8px 0; }
  .msg-badge {
    display: inline-block; margin-inline-start: 6px; padding: 1px 8px; border-radius: 999px;
    background: var(--amber); color: var(--amber-ink); font-size: 0.75rem; font-weight: 700;
  }
  .msg-list { list-style: none; margin: 4px 0 0; padding: 0; font-size: 0.92rem; }
  .msg-list li { padding: 8px 0; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
  .msg-list .meta { color: var(--text-muted); font-family: var(--font-mono); font-size: 0.78rem; display: block; }
  .msg-list li.unread { font-weight: 600; }

  /* Message the facilitator (roadmap item 4, added 7 October 2026). Since
     11 October 2026 the typing box has its own label and a clear edge, so it
     is recognisable as a place to type on a phone. */
  .msg-reply { max-width: 640px; margin: 0 auto; padding: 0 16px 72px; }
  .msg-reply-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px 18px; }
  .msg-reply-label { font-size: 1.05rem; margin: 0 0 12px; }
  .msg-reply-card label { margin-top: 12px; }
  .msg-reply-card label:first-of-type { margin-top: 0; }
  .msg-reply textarea { min-height: 76px; resize: vertical; border-width: 2px; }
  .msg-reply-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .msg-reply-row .count { font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; }
  .msg-reply-feedback { font-size: 0.88rem; margin-top: 8px; min-height: 1.2em; }
  .msg-reply-feedback.ok { color: var(--teal-soft); }
  .msg-reply-feedback.err { color: var(--red-soft); }
</style>
</head>
<body>
  <header class="pp-top">
    <span class="pp-brand small" data-i18n-skip><svg viewBox="0 0 52 52" aria-hidden="true"><path d="M26 4 L45 11 V24 C45 36 37 44 26 48 C15 44 7 36 7 24 V11 Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 24 Q20 24 22 30 Q24 36 30 30 L38 20" fill="none" stroke="#d84a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Plan<span class="proof">Proof</span></span></span>
    <div class="pp-context"><strong id="clientLabel" data-i18n-skip>PlanProof</strong><div id="whoLabel"></div></div>
  </header>
  <div class="msg-banner" id="msgBanner" role="status" aria-live="polite">
    <div class="msg-banner-inner">
      <div>
        <div class="msg-label" data-i18n-nodes="part.msg.bannerLabel">Message from the facilitator <span id="msgBannerTime"></span></div>
        <div class="msg-text" id="msgBannerText"></div>
      </div>
      <button id="msgBannerOk" data-i18n="part.msg.gotIt">Got it</button>
    </div>
  </div>
  <main id="main" data-i18n-nodes="part.loading">Loading…</main>
  <section class="msg-history" id="msgHistory" hidden>
    <details id="msgHistoryDetails">
      <summary data-i18n-nodes="part.msg.historyTitle">Messages from the facilitator<span class="msg-badge" id="msgBadge" hidden></span></summary>
      <ul class="msg-list" id="msgList"></ul>
    </details>
  </section>
  <section class="msg-reply" id="msgReply" hidden>
    <div class="msg-reply-card pp-form">
      <h2 class="msg-reply-label" data-i18n="part.reply.title">Message the facilitator</h2>
      <label for="replyPreset" data-i18n="part.reply.presetLabel">Choose a ready-made message</label>
      <select id="replyPreset"><option value="" data-i18n="part.reply.presetPlaceholder">— Choose a ready-made message —</option></select>
      <label for="replyText" data-i18n="part.reply.textLabel">Or type your own message</label>
      <textarea id="replyText" maxlength="280" placeholder="Tap here and type your message" data-i18n-attr="placeholder:part.reply.textPlaceholder"></textarea>
      <div class="msg-reply-row">
        <span class="count" id="replyCount">0 / 280</span>
        <button class="pp-btn" id="replySendBtn" disabled data-i18n="part.reply.send">Send &rarr;</button>
      </div>
      <div class="msg-reply-feedback" id="replyFeedback"></div>
    </div>
  </section>

<!-- Pinned and served from plan-proof.com (system review, 9 October 2026): a CDN outage or a silent library update can no longer break the player. -->
<script src="/vendor/supabase-js-2.117.2.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"></script>
<script src="./lang.js"></script>
<script src="./shared.js"></script>
<script src="./survey.js"></script>
<script>
  const sessionId = getSessionId();
  const mainEl = document.getElementById("main");
  const clientLabelEl = document.getElementById("clientLabel");
  const whoLabelEl = document.getElementById("whoLabel");

  let identity = null;
  let survey = null; // the feedback survey under the thank-you (survey.js)
  let formIdx = null; // which inject index the on-screen form currently represents
  let formInject = null; // the inject object for formIdx (kept separately so leaving an inject saves under ITS group/individual type, not the next one's)
  let attachments = []; // attachments already uploaded for the current inject
  let submittedForCurrent = false;
  let injectLocked = false; // true once Submit was clicked OR this inject's time ran out
  // True once this device has actually typed or attached something for the
  // current inject. The automatic saves (on timeout, or when the facilitator
  // moves on) only fire when this is true — otherwise a phone that reloaded
  // mid-exercise (and so shows a blank form) would overwrite the answer
  // already saved on the server with an empty one.
  let dirtyForCurrent = false;
  // True while the Facilitator has unlocked an answer this device had
  // already SUBMITTED. Edits made then are amendments to a submitted answer,
  // so they're saved as "submitted" — otherwise reopening it would quietly
  // turn an on-time answer back into an unsubmitted draft on the dashboard.
  let reopenedSubmitted = false;
  // "Edit answer" (Ahmed, 11 October 2026): a team can reopen its own
  // submitted answer while the inject's time is still running. While it is
  // being changed nothing is sent — the answer as submitted stays as it is
  // until "Submit changes" (or the time running out) sends the new version.
  let editingSubmitted = false;
  let editBaseline = null;   // the answer as submitted: { answerText, attachments }
  let editDirty = false;     // something was really changed since "Edit answer"
  let lockLabel = T("part.lock.timesUp"); // what the greyed button says when the form is closed
  let submitting = false;    // a Submit is on its way to the server
  let currentExtraMinutes = 0; // the exercise_sessions.inject_extra_minutes value already applied to the running timer, for the inject currently on screen
  let forceUnlocked = false; // mirrors exercise_sessions.inject_force_unlocked for the inject currently on screen
  let latestRow = null;
  let saveTimer = null;
  let injectTimerInterval = null;
  // Client-side-only history of what this device had for each inject index,
  // so going back to an earlier inject (the Facilitator can move Previous,
  // then Unlock) restores what was there instead of a blank form. Purely
  // local — answer text and attachments are write-only for every browser
  // (see "Participant task submission" in design-notes.md), so this is
  // never re-read from the server. Lost on a page reload; the server copy
  // is unaffected either way.
  const answersCache = {};
  // State used by init(), which runs just below — declared here, before it.
  let storedRun = null;          // which run of the exercise the answers kept on this phone belong to
  let restoredFromPhone = {};    // inject index -> true: brought back from this phone after a reload
  let replyReady = false;        // the "Message the facilitator" box has been set up
  let refreshReplyControls = null; // re-checks whether the box may be used (set by initReply)
  let messagesLoading = false;
  let messagesAgain = null;
  let currentAnswerEl = null;
  let currentFileInput = null;
  let currentSubmitBtn = null;
  let currentSaveStatusEl = null;

  if (!sessionId) {
    mainEl.innerHTML = `<div class="center-note">${escapeHtml(T("part.error.noSession"))}</div>`;
  } else {
    try {
      identity = JSON.parse(localStorage.getItem(`pp_identity_${sessionId}`) || "null");
    } catch {
      identity = null;
    }
    const joinLink = `./join.html?session=${encodeURIComponent(sessionId)}`;
    if (!identity || identity.role !== "participant") {
      mainEl.innerHTML = `<div class="center-note">${escapeHtml(T("part.gate.needJoin"))}
        <br/><a href="${joinLink}">${escapeHtml(T("part.gate.joinNow"))}</a></div>`;
    } else if (!identity.attendeeId) {
      // Registered before registration asked for first/family name and job
      // title, and before individual answers existed — no attendee id to
      // file an individual answer under.
      mainEl.innerHTML = `<div class="center-note">${escapeHtml(T("part.gate.registerAgain"))}
        <br/><a href="${joinLink}">${escapeHtml(T("part.gate.register"))}</a></div>`;
    } else {
      whoLabelEl.textContent = identity.room
        ? T("part.who.withRoom", { name: String(identity.name), department: String(identity.department), room: identity.room })
        : T("part.who.noRoom", { name: String(identity.name), department: String(identity.department) });
      init();
    }
  }

  function init() {
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    loadStoredAnswers();
    // Live updates (the doorbell) plus the safety net (shared.js
    // keepSessionInSync): a silently dropped live connection is noticed and
    // refetched within seconds; the form is only re-rendered when the
    // session really changed.
    const sync = keepSessionInSync({
      sessionId,
      supabaseClient,
      onRow: (row) => {
        render(row);
        awake.update();
        if (checkins) checkins.beatSoon();
      },
      onRecovered: () => loadMessages(false), // pick up any message missed while disconnected
      onRing: (kind) => { if (kind === "message") loadMessages(true); },
    });

    // Keep the phone awake while the exercise is running (item 6): a
    // sleeping phone would stop checking in and look offline on the
    // Facilitator's control tower. Released at the end.
    const awake = keepAwake({
      wanted: () => !!latestRow && latestRow.status === "running",
      onChange: (st) => setNotice("awakeNotice", st === "off" ? AWAKE_NOTICE : null),
    });

    // Check-ins for the control tower; the reply also shows where the
    // exercise really is, so a page that missed an update corrects itself.
    const checkins = startCheckins({
      sessionId,
      kind: "person",
      attendeeId: identity.attendeeId,
      getState: () => ({
        page: "participant",
        shownStatus: latestRow ? latestRow.status : null,
        shownInject: latestRow && latestRow.status === "running" ? latestRow.current_inject_index : null,
        sound: "na",
        awake: awake.state(),
        live: sync.liveState(),
      }),
      onReply: (reply) => handleCheckinReply(reply, { sync, getRow: () => latestRow }),
      onRefused: () =>
        setNotice("regNotice", T("part.notice.notRegistered")),
    });

    // Back from a phone call, a locked screen or another app: catch up
    // first, then say where the exercise is now.
    watchAway({
      onBack: async (ms) => {
        await sync.resync("back");
        showToast(awayText(ms, latestRow));
      },
    });

    fetchSession(sessionId).then(sync.deliver).catch((err) => {
      mainEl.innerHTML = `<div class="center-note">${escapeHtml(T("part.error.loadFailed", { detail: String(PPLang.dbMessage(err.message)) }))}</div>`;
    });
    loadMessages(false);
    initReply();
  }

  // ---- The unfinished answer is also kept on this phone (item 6) --------
  // If the phone closes the page (a long call, a flat battery, a reload),
  // the answer box comes back with what was typed instead of blank — so
  // nobody retypes a shorter answer over the one already saved. Kept per
  // run of the exercise, and removed from the phone when the exercise ends.
  // The server copy is still what the report uses.
  function answersKey() {
    return `pp_answers_${sessionId}_${identity.attendeeId}`;
  }
  function loadStoredAnswers() {
    try {
      const stored = JSON.parse(localStorage.getItem(answersKey()) || "null");
      if (stored && stored.items && typeof stored.items === "object") {
        storedRun = stored.run === undefined ? null : stored.run;
        Object.keys(stored.items).forEach((k) => {
          answersCache[k] = stored.items[k];
          restoredFromPhone[k] = true;
        });
      }
    } catch {
      /* storage blocked or damaged — start blank, as before */
    }
  }
  function snapshotCurrent() {
    if (formIdx === null) return;
    const el = document.getElementById("answerText");
    answersCache[formIdx] = {
      answerText: el ? el.value : (answersCache[formIdx] && answersCache[formIdx].answerText) || "",
      attachments: attachments.slice(),
      submitted: submittedForCurrent,
      locked: injectLocked,
      dirty: dirtyForCurrent,
      editing: editingSubmitted,
      baseline: editingSubmitted ? editBaseline : null,
    };
  }
  function storeAnswers() {
    try {
      snapshotCurrent();
      const run = latestRow ? latestRow.run_number : storedRun;
      localStorage.setItem(answersKey(), JSON.stringify({ run, items: answersCache }));
    } catch {
      /* storage blocked — the answer is still saved to the server */
    }
  }
  function clearStoredAnswers() {
    Object.keys(answersCache).forEach((k) => delete answersCache[k]);
    restoredFromPhone = {};
    try { localStorage.removeItem(answersKey()); } catch { /* ignore */ }
  }

  // After End the answers stay on this device for one hour (item 8), so an
  // End pressed by mistake costs nobody their text. Then they are removed —
  // at once if the page is open, or the next time it is opened.
  let answersCleanupTimer = null;
  function cancelAnswersCleanup() {
    if (answersCleanupTimer) { clearTimeout(answersCleanupTimer); answersCleanupTimer = null; }
  }
  function scheduleAnswersCleanup(row) {
    cancelAnswersCleanup();
    const endedMs = row && row.ended_at ? Date.parse(row.ended_at) : NaN;
    // No end time to count from: remove now, as before.
    const left = isNaN(endedMs) ? 0 : endedMs + ANSWERS_KEEP_AFTER_END_MS - Date.now();
    if (left <= 0) { clearStoredAnswers(); return; }
    answersCleanupTimer = setTimeout(() => {
      answersCleanupTimer = null;
      if (latestRow && latestRow.status === "ended") clearStoredAnswers();
    }, Math.min(left, 2147000000));
  }

  // ---- Messages from the facilitator (added 5 October 2026) -------------
  // A banner for the newest unread message, a list of every message, and an
  // unread count. Phones stay silent (in-room devices don't play sound — the
  // room display chimes); a short vibration is tried where the phone
  // supports it. The banner goes when the person taps "Got it" or the
  // inject changes; the message stays in the list.
  const msgBannerEl = document.getElementById("msgBanner");
  const msgBannerTextEl = document.getElementById("msgBannerText");
  const msgBannerTimeEl = document.getElementById("msgBannerTime");
  const msgHistoryEl = document.getElementById("msgHistory");
  const msgBadgeEl = document.getElementById("msgBadge");
  const msgListEl = document.getElementById("msgList");
  const baseTitle = document.title;
  let messages = [];
  const readKey = `pp_msgread_${sessionId}`;
  let lastReadAt = null; // created_at (ms) of the newest message this person has acknowledged
  try {
    const stored = localStorage.getItem(readKey);
    lastReadAt = stored ? Number(stored) : null;
  } catch {
    lastReadAt = null;
  }

  document.getElementById("msgBannerOk").addEventListener("click", markAllRead);
  document.getElementById("msgHistoryDetails").addEventListener("toggle", (e) => {
    if (e.target.open) markAllRead();
  });

  // Messages for everyone, plus (from roadmap item 4) ones for this person's
  // own department.
  function isForMe(m) {
    if (!m.department) return true;
    return (
      String(m.department).trim().toLowerCase() ===
      String(identity.department || "").trim().toLowerCase()
    );
  }
  const msgTime = (m) => new Date(m.created_at).getTime();
  const msgContext = (m) => (m.inject_index === undefined ? null : m.inject_index);
  function currentContext() {
    return latestRow && latestRow.status === "running" ? latestRow.current_inject_index : null;
  }
  // With no saved read marker (first visit, or storage blocked), only
  // messages sent for what's showing now count as new — older ones are
  // treated as already read rather than all lighting up at once.
  function isUnread(m) {
    if (lastReadAt !== null) return msgTime(m) > lastReadAt;
    return msgContext(m) === currentContext();
  }

  // Messages come through the checked function (item 6): those for
  // everyone plus this person's own department. fromRing = a doorbell ring
  // said a new one exists — a short vibration when one really is new.

  async function loadMessages(fromRing) {
    if (messagesLoading) {
      messagesAgain = messagesAgain || !!fromRing;
      return;
    }
    messagesLoading = true;
    try {
      const fresh = (await fetchMessages(sessionId, identity.department)).filter(isForMe);
      const known = new Set(messages.map((m) => m.id));
      const first = messages.length === 0 && !fromRing;
      const gotNew = fresh.some((m) => !known.has(m.id));
      messages = fresh;
      renderMessages();
      if (gotNew && fromRing && !first) {
        try {
          if (navigator.vibrate) navigator.vibrate(200);
        } catch {
          /* not supported — the banner is enough */
        }
      }
    } catch (err) {
      console.warn("Couldn't load messages:", err.message);
    } finally {
      messagesLoading = false;
      if (messagesAgain !== null) {
        const again = messagesAgain;
        messagesAgain = null;
        loadMessages(again);
      }
    }
  }

  function markAllRead() {
    if (messages.length) {
      lastReadAt = Math.max(...messages.map(msgTime));
      try {
        localStorage.setItem(readKey, String(lastReadAt));
      } catch {
        /* storage blocked — still marked read for this page */
      }
    }
    renderMessages();
  }

  function renderMessages() {
    msgHistoryEl.hidden = messages.length === 0;
    const unread = messages.filter(isUnread);
    msgBadgeEl.hidden = unread.length === 0;
    msgBadgeEl.textContent = T("part.msg.newCount", { count: unread.length });
    document.title = unread.length ? `(${unread.length}) ${baseTitle}` : baseTitle;

    msgListEl.innerHTML = messages
      .slice()
      .reverse()
      .map(
        (m) => `<li class="${isUnread(m) ? "unread" : ""}"><span class="meta">${escapeHtml(formatMessageTime(m.created_at))}</span>${escapeHtml(m.body)}</li>`
      )
      .join("");

    // Banner: the newest unread message, only while its inject is still
    // the one showing (and never after the exercise has ended).
    const ended = latestRow && latestRow.status === "ended";
    const newestUnread = unread[unread.length - 1];
    if (!ended && newestUnread && msgContext(newestUnread) === currentContext()) {
      msgBannerTextEl.textContent = newestUnread.body;
      msgBannerTimeEl.textContent = `· ${formatMessageTime(newestUnread.created_at)}`;
      msgBannerEl.classList.add("show");
    } else {
      msgBannerEl.classList.remove("show");
    }
  }

  // ---- Message the facilitator (roadmap item 4, added 7 October 2026) ---
  // Same editable-dropdown pattern as the facilitator's own message boxes.
  // Sent as this person's department (self-declared, no individual stored —
  // the same trust model a group answer already uses), so it reaches the
  // facilitator as "Finance" or whichever department, never this person's
  // name.
  function initReply() {
    const sectionEl = document.getElementById("msgReply");
    const presetEl = document.getElementById("replyPreset");
    const textEl = document.getElementById("replyText");
    const countEl = document.getElementById("replyCount");
    const sendBtn = document.getElementById("replySendBtn");
    const feedbackEl = document.getElementById("replyFeedback");
    let sending = false;

    DEPARTMENT_TO_FACILITATOR_PRESETS.forEach((p) => {
      const opt = document.createElement("option");
      opt.value = p.key;
      opt.textContent = p.text;
      presetEl.appendChild(opt);
    });

    function updateControls() {
      const len = textEl.value.trim().length;
      countEl.textContent = `${textEl.value.length} / ${MESSAGE_MAX_LENGTH}`;
      const ended = latestRow && latestRow.status === "ended";
      sendBtn.disabled = sending || len === 0 || ended;
      presetEl.disabled = ended;
      textEl.disabled = ended;
      if (ended) feedbackEl.textContent = T("part.reply.ended");
    }

    presetEl.addEventListener("change", () => {
      const preset = DEPARTMENT_TO_FACILITATOR_PRESETS.find((p) => p.key === presetEl.value);
      if (preset) textEl.value = preset.text;
      feedbackEl.textContent = "";
      feedbackEl.className = "msg-reply-feedback";
      updateControls();
      textEl.focus();
    });
    textEl.addEventListener("input", () => {
      feedbackEl.textContent = "";
      feedbackEl.className = "msg-reply-feedback";
      updateControls();
    });

    sendBtn.addEventListener("click", async () => {
      const body = textEl.value.trim();
      if (!body) return;
      const preset = DEPARTMENT_TO_FACILITATOR_PRESETS.find((p) => p.key === presetEl.value);
      const presetKey = preset && preset.text === body ? preset.key : null;
      sending = true;
      updateControls();
      feedbackEl.className = "msg-reply-feedback";
      feedbackEl.textContent = T("part.reply.sending");
      try {
        await sendDepartmentRequest(sessionId, { body, presetKey, department: identity.department });
        textEl.value = "";
        presetEl.value = "";
        feedbackEl.className = "msg-reply-feedback ok";
        feedbackEl.textContent = T("part.reply.sent", { time: formatMessageTime(new Date().toISOString()) });
      } catch (err) {
        feedbackEl.className = "msg-reply-feedback err";
        feedbackEl.textContent = PPLang.dbMessage(err.message);
      } finally {
        sending = false;
        updateControls();
      }
    });

    replyReady = true;
    refreshReplyControls = updateControls;
    sectionEl.hidden = !!(latestRow && latestRow.status === "ended");
    updateControls();
    // Re-checked on every session row update (render() calls renderMessages,
    // which doesn't touch this section) — status changing to "ended" should
    // disable sending even without the person touching the form.
    setInterval(updateControls, 5000);
  }

  function isIndividual(inject) {
    return injectOutput(inject) === "individual";
  }

  // Every save goes through here so a group inject is saved as the
  // department's shared answer and an individual inject as this person's
  // own answer.
  function saveFor(idx, inject, fields) {
    return saveSubmission(sessionId, {
      injectIndex: idx,
      writerId: identity.attendeeId,
      individual: isIndividual(inject),
      ...fields,
    });
  }

  // When the time for the inject on screen runs out (ms), or null when it
  // has no time limit. Includes any time the facilitator has added.
  function currentDeadline() {
    return latestRow && formInject ? injectDeadlineMs(latestRow, formInject) : null;
  }
  function timeRemains() {
    const d = currentDeadline();
    return !d || d > Date.now();
  }

  function render(row) {
    if (!row) return;
    // A new run (the facilitator pressed Reset): answers kept on this phone
    // belong to the earlier run — start clean.
    if (storedRun !== null && row.run_number !== undefined && row.run_number !== storedRun) {
      clearStoredAnswers();
    }
    if (row.run_number !== undefined) storedRun = row.run_number;
    latestRow = row;
    clientLabelEl.textContent = row.label || "PlanProof";
    // The message banner follows what's showing (hides on inject change).
    renderMessages();

    // The "Message the facilitator" box belongs to a running exercise or the
    // lobby; under the thank-you screen it would only be a greyed-out box.
    const replySectionEl = document.getElementById("msgReply");
    if (replySectionEl && replyReady) replySectionEl.hidden = row.status === "ended";
    if (refreshReplyControls) refreshReplyControls(); // open again at once if the exercise carries on after End

    if (row.status === "ended") {
      clearInjectTimer();
      // Item 8 (11 October 2026): keep what is on screen on this device
      // first — if End was pressed by mistake and the exercise carries on,
      // the answer boxes come back with their text instead of blank.
      if (formIdx !== null) storeAnswers();
      // The feedback survey sits under the thank-you (16 October 2026). The
      // end screen is drawn once, so a refresh never wipes a tap in progress;
      // the "close this page" line belongs to the survey card from here on.
      if (!mainEl.querySelector(".pp-thanks-end")) {
        mainEl.innerHTML = endScreenHtml({ name: greetingName(identity), close: false }) + '<div id="surveyRoot" hidden></div>';
        survey = createSurvey(document.getElementById("surveyRoot"), { sessionId, attendeeId: identity.attendeeId, observer: false });
      }
      survey.refresh(row);
      formIdx = null;
      formInject = null;
      editingSubmitted = false;
      editBaseline = null;
      // The copy of the answers on this device is kept for one hour after
      // End, then removed (it used to be removed at once). The server copy
      // is what the report uses either way.
      scheduleAnswersCleanup(row);
      return;
    }
    cancelAnswersCleanup();
    if (row.status === "lobby") {
      clearInjectTimer();
      mainEl.innerHTML = welcomeScreenHtml({ name: greetingName(identity) });
      formIdx = null;
      formInject = null;
      editingSubmitted = false;
      editBaseline = null;
      return;
    }

    const injects = (row.scenario && row.scenario.injects) || [];
    const idx = row.current_inject_index;
    const inject = injects[idx];
    if (!inject) {
      mainEl.innerHTML = `<div class="center-note">${escapeHtml(T("part.error.noInject", { index: String(idx) }))}</div>`;
      return;
    }

    if (idx !== formIdx) {
      // Moving to a different inject (forward via Next, or backward via
      // Previous). Snapshot what's on screen into the local cache first, so
      // coming back to THIS inject later restores it instead of showing blank.
      if (formIdx !== null) {
        // Changes to a submitted answer that were never sent are dropped:
        // the facilitator has moved on, and the answer as submitted stands.
        if (editingSubmitted) abandonEdit();
        const lastAnswerEl = document.getElementById("answerText");
        snapshotCurrent();
        storeAnswers();
        // "Facilitator moved on before they clicked Submit" — keep whatever
        // they wrote as status=autosaved rather than losing it. Saved under
        // the inject being LEFT (formInject), not the new one.
        if (!submittedForCurrent && !injectLocked && dirtyForCurrent && lastAnswerEl) {
          saveFor(formIdx, formInject, {
            answerText: lastAnswerEl.value,
            attachments,
            status: reopenedSubmitted ? "submitted" : "autosaved",
          }).catch((err) => console.warn("Autosave on inject change failed:", err.message));
        }
      }

      reopenedSubmitted = false;
      formIdx = idx;
      formInject = inject;
      currentExtraMinutes = row.inject_extra_minutes || 0;
      forceUnlocked = !!row.inject_force_unlocked;
      lockLabel = T("part.lock.timesUp");
      editingSubmitted = false;
      editBaseline = null;
      editDirty = false;

      const cached = answersCache[idx];
      const deadline = injectDeadlineMs(row, inject);
      const open = !deadline || deadline > Date.now();
      // Restored from this phone after a reload: a form that had locked on
      // time-out reopens if the facilitator has since added time.
      if (cached && restoredFromPhone[idx] && cached.locked && !cached.submitted) {
        if (deadline && deadline > Date.now()) cached.locked = false;
      }
      let lostEdit = false;
      let answerText = cached ? cached.answerText : "";
      attachments = cached ? (cached.attachments || []).slice() : [];
      submittedForCurrent = forceUnlocked ? false : cached ? !!cached.submitted : false;
      injectLocked = forceUnlocked ? false : cached ? !!cached.locked : false;
      dirtyForCurrent = cached ? !!cached.dirty : false;
      // The page closed while a submitted answer was being changed: carry on
      // changing it if there is still time; otherwise the unsent changes are
      // dropped and the answer as submitted is shown.
      if (cached && cached.editing && cached.baseline && submittedForCurrent) {
        if (open) {
          editingSubmitted = true;
          editDirty = true;
          editBaseline = cached.baseline;
          injectLocked = false;
        } else {
          answerText = cached.baseline.answerText || "";
          attachments = (cached.baseline.attachments || []).slice();
          injectLocked = true;
          lostEdit = true;
        }
      }

      renderForm(inject, idx, { answerText });
      armTimer();

      if (lostEdit && currentSaveStatusEl) {
        currentSaveStatusEl.textContent = T("part.status.lostEdit");
        storeAnswers();
      } else if (forceUnlocked && cached && (cached.submitted || cached.locked) && currentSaveStatusEl) {
        currentSaveStatusEl.textContent =
          cached.submitted ? T("part.status.unlockedWasSubmitted") : T("part.status.unlockedWasTimedOut");
      } else if (!forceUnlocked && cached && cached.locked && !cached.submitted && currentSaveStatusEl) {
        currentSaveStatusEl.textContent = dirtyForCurrent
          ? T("part.status.timesUpSaved")
          : T("part.status.timesUp");
      }
      if (cached && restoredFromPhone[idx]) {
        delete restoredFromPhone[idx];
        if (currentSaveStatusEl && !currentSaveStatusEl.textContent && (cached.answerText || (cached.attachments || []).length)) {
          currentSaveStatusEl.textContent = editingSubmitted
            ? T("part.status.restoredEdit")
            : T("part.status.restored");
        }
      }
    } else {
      formInject = inject;
      const forceNow = !!row.inject_force_unlocked;
      if (forceNow !== forceUnlocked) {
        if (forceNow) {
          const wasSubmitted = submittedForCurrent;
          const wasLocked = injectLocked;
          forceUnlocked = true;
          submittedForCurrent = false;
          reopenedSubmitted = reopenedSubmitted || wasSubmitted;
          unlockForCurrentInject(
            T("part.status.unlocked"),
            wasSubmitted,
            wasLocked
          );
        } else {
          forceUnlocked = false;
          lockForCurrentInject(true, T("part.status.lockedAgain"));
        }
        armTimer();
      }

      // More time from the facilitator: the countdown follows at once. A
      // form that had locked on time-out reopens (never one that was
      // submitted — that one gets its "Edit answer" button back instead),
      // and not while the Facilitator's manual unlock is in effect.
      const extraNow = row.inject_extra_minutes || 0;
      if (extraNow !== currentExtraMinutes) {
        const more = extraNow > currentExtraMinutes;
        currentExtraMinutes = extraNow;
        const deadline = injectDeadlineMs(row, inject);
        if (more && !forceUnlocked && !submittedForCurrent && injectLocked && deadline && deadline > Date.now()) {
          unlockForCurrentInject(T("part.status.moreTime"), false, true);
        }
        armTimer();
        drawState();
      }
    }
  }

  function renderForm(inject, idx, initial) {
    initial = initial || {};
    const individual = isIndividual(inject);
    const responsible = isDepartmentResponsible(inject, identity.department, latestRow, idx);
    const responsibleList = injectResponsible(inject);
    const responsibleText = responsibleList.some((d) => String(d).toLowerCase() === "all")
      ? T("part.task.allDepartments")
      : responsibleList.join(", ");

    mainEl.innerHTML = `
      <div class="clock-wrap">
        <div class="pp-clock" id="injectClock" data-state="none" role="timer" aria-label="${escapeHtml(T("part.clock.aria"))}">
          <div class="pp-clock-label">${escapeHtml(T("part.clock.label"))}</div>
          <div class="pp-clock-value" id="injectTimerValue">--:--</div>
          <div class="pp-clock-note" id="injectTimerNote"></div>
          <div class="pp-clock-bar"><i id="injectTimerBar"></i></div>
        </div>
      </div>
      <div class="inject-card">
        <div class="task-tags">
          <span class="tag ${individual ? "individual" : ""}">${escapeHtml(individual ? T("part.task.individual") : T("part.task.group"))}</span>
          <span class="tag">${escapeHtml(T("part.task.responsible", { list: responsibleText }))}</span>
        </div>
        <div class="inject-title">${escapeHtml(inject.title)}</div>
        <div class="inject-desc">${escapeHtml(inject.desc)}</div>
        ${injectTaskText(inject) ? `<div class="inject-task">${escapeHtml(injectTaskText(inject))}</div>` : ""}
      </div>
      <div class="answer-card pp-form">
        ${responsible ? "" : `<div class="not-required">${escapeHtml(T("part.form.notRequired"))}</div>`}
        <label for="answerText">${escapeHtml(individual ? T("part.form.labelIndividual") : T("part.form.labelGroup", { department: String(identity.department == null ? "" : identity.department) }))}</label>
        <div class="hint">${escapeHtml(individual
          ? T("part.form.hintIndividual")
          : T("part.form.hintGroup", { department: String(identity.department == null ? "" : identity.department) }))}</div>
        <textarea id="answerText" placeholder="${escapeHtml(individual ? T("part.form.placeholderIndividual") : T("part.form.placeholderGroup", { department: String(identity.department == null ? "" : identity.department) }))}">${escapeHtml(initial.answerText || "")}</textarea>
        <div class="attachments">
          <label for="fileInput">${escapeHtml(T("part.form.attachLabel"))}</label>
          <input type="file" id="fileInput" multiple
            accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,image/jpeg,image/png,image/heic" />
          <ul class="attachment-list" id="attachmentList"></ul>
        </div>
        <div class="save-status" id="saveStatus" role="status"></div>
        <div class="pp-error error" id="errorBox"></div>
        <div id="answerActions"></div>
      </div>
    `;

    const answerEl = document.getElementById("answerText");
    const fileInput = document.getElementById("fileInput");
    const saveStatusEl = document.getElementById("saveStatus");
    const errorBoxEl = document.getElementById("errorBox");

    currentAnswerEl = answerEl;
    currentFileInput = fileInput;
    currentSaveStatusEl = saveStatusEl;

    answerEl.addEventListener("input", () => {
      if (injectLocked) return;
      dirtyForCurrent = true;
      storeAnswers(); // on the phone at once; on the server 1.5 seconds after the last keystroke
      if (editingSubmitted) {
        // A submitted answer being changed: nothing goes to the server until
        // "Submit changes" (or the time runs out), so the answer as submitted
        // is never replaced by something half-typed.
        editDirty = true;
        saveStatusEl.textContent = UNSENT_TEXT;
        return;
      }
      saveStatusEl.textContent = T("part.status.saving");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => autosaveDraft(idx, inject, answerEl, saveStatusEl), 1500);
    });

    fileInput.addEventListener("change", async () => {
      if (injectLocked) return;
      const files = Array.from(fileInput.files || []);
      fileInput.value = "";
      if (attachments.length + files.length > 3) {
        errorBoxEl.textContent = T("part.error.tooManyFiles");
        errorBoxEl.style.display = "block";
        return;
      }
      for (const file of files) {
        if (file.size > 10 * 1024 * 1024) {
          errorBoxEl.textContent = T("part.error.fileTooBig", { name: file.name });
          errorBoxEl.style.display = "block";
          continue;
        }
        try {
          saveStatusEl.textContent = T("part.status.uploading", { name: file.name });
          const uploaded = await uploadAttachment(sessionId, idx, identity.department, file);
          attachments.push(uploaded);
          dirtyForCurrent = true;
          storeAnswers();
          renderAttachmentList();
          if (editingSubmitted) {
            editDirty = true;
            saveStatusEl.textContent = UNSENT_TEXT;
          } else {
            await autosaveDraft(idx, inject, answerEl, saveStatusEl);
          }
        } catch (err) {
          errorBoxEl.textContent = PPLang.dbMessage(err.message);
          errorBoxEl.style.display = "block";
        }
      }
    });

    // One listener for whichever buttons the answer's state shows.
    document.getElementById("answerActions").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.id === "submitBtn") submitAnswer(idx, inject, btn, errorBoxEl);
      else if (btn.id === "editBtn") startEdit();
      else if (btn.id === "cancelEditBtn") cancelEdit();
    });

    drawState();
    renderAttachmentList();
  }

  const UNSENT_TEXT = T("part.status.unsent");

  // Draws the buttons under the answer for the state it is in, and opens or
  // closes the answer box to match:
  //   writing            -> "Submit answer"
  //   submitted          -> the green line, and "Edit answer" while the time
  //                         for this inject is still running
  //   changing a submitted answer -> "Cancel" and "Submit changes"
  //   time's up / locked -> a greyed button saying so
  function drawState() {
    const box = document.getElementById("answerActions");
    if (!box || !currentAnswerEl || !formInject) return;
    const open = !injectLocked;
    currentAnswerEl.disabled = !open;
    if (currentFileInput) currentFileInput.disabled = !open;

    const individual = isIndividual(formInject);
    const submittedText = escapeHtml(individual
      ? T("part.submitted.individual")
      : T("part.submitted.group", { department: String(identity.department == null ? "" : identity.department) }));
    let html;
    if (editingSubmitted) {
      html = `
        <div class="editing-note">${escapeHtml(T("part.edit.note"))}</div>
        <div class="row-buttons">
          <button type="button" class="pp-btn ghost" id="cancelEditBtn">${escapeHtml(T("part.edit.cancel"))}</button>
          <button type="button" class="pp-btn submit" id="submitBtn">${escapeHtml(T("part.edit.submitChanges"))}</button>
        </div>`;
    } else if (submittedForCurrent) {
      // "Edit answer" (Ahmed, 11 October 2026): the team can reopen its own
      // answer while the countdown runs; after that only the facilitator's
      // Unlock reopens it.
      const running = latestRow && latestRow.status === "running";
      const canEdit = running && !forceUnlocked && timeRemains();
      html = `<div class="submitted-banner">${submittedText}</div>` + (canEdit
        ? `<div class="row-buttons"><button type="button" class="pp-btn ghost" id="editBtn">${escapeHtml(T("part.edit.editAnswer"))}</button></div>
           <div class="pp-hint edit-hint">${escapeHtml(currentDeadline()
             ? T("part.edit.hintUntilTime")
             : T("part.edit.hintUntilNext"))}</div>`
        : `<div class="pp-hint edit-hint">${escapeHtml(T("part.edit.hintOver"))}</div>`);
    } else if (injectLocked) {
      html = `<div class="row-buttons"><button type="button" class="pp-btn submit" id="submitBtn" disabled>${escapeHtml(lockLabel)}</button></div>`;
    } else {
      html = `<div class="row-buttons"><button type="button" class="pp-btn submit" id="submitBtn">${escapeHtml(T("part.form.submit"))}</button></div>`;
    }
    box.innerHTML = html;
    currentSubmitBtn = document.getElementById("submitBtn");
    renderAttachmentList();
    updateClock();
  }

  // Submit, and "Submit changes" for a submitted answer being changed.
  async function submitAnswer(idx, inject, btn, errorBoxEl) {
    if (injectLocked) return; // time ran out before the click was processed
    const answerEl = currentAnswerEl;
    const wasEditing = editingSubmitted;
    errorBoxEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = T("part.form.submitting");
    submitting = true;
    try {
      clearTimeout(saveTimer); // a pending draft save must not land after (and overwrite) the submit
      await saveFor(idx, inject, {
        answerText: answerEl.value,
        attachments,
        status: "submitted",
      });
      if (idx !== formIdx) return; // the facilitator moved on while it was being sent
      dirtyForCurrent = true;
      submittedForCurrent = true;
      injectLocked = true; // closed again; "Edit answer" reopens it while the time runs
      editingSubmitted = false;
      editBaseline = null;
      editDirty = false;
      if (currentSaveStatusEl) currentSaveStatusEl.textContent = wasEditing ? T("part.status.changesSubmitted") : "";
      storeAnswers();
      drawState();
    } catch (err) {
      if (idx !== formIdx) return;
      errorBoxEl.textContent = PPLang.dbMessage(err.message);
      errorBoxEl.style.display = "block";
      drawState();
    } finally {
      submitting = false;
      // The time ran out while it was being sent: settle the form now.
      if (idx === formIdx && !forceUnlocked && !timeRemains()) onTimeUp();
    }
  }

  // "Edit answer": reopen this device's submitted answer. What was submitted
  // is kept aside so Cancel (or running out of time with nothing changed)
  // puts it back exactly.
  function startEdit() {
    if (!submittedForCurrent || editingSubmitted || forceUnlocked || !timeRemains()) {
      drawState();
      return;
    }
    editBaseline = { answerText: currentAnswerEl.value, attachments: attachments.slice() };
    editingSubmitted = true;
    editDirty = false;
    injectLocked = false;
    if (currentSaveStatusEl) currentSaveStatusEl.textContent = "";
    storeAnswers();
    drawState();
    currentAnswerEl.focus();
  }

  // Puts the answer back as it was submitted and closes it again.
  function restoreBaseline() {
    if (editBaseline) {
      if (currentAnswerEl) currentAnswerEl.value = editBaseline.answerText || "";
      attachments = (editBaseline.attachments || []).slice();
    }
    editingSubmitted = false;
    editBaseline = null;
    editDirty = false;
    injectLocked = true;
  }
  function cancelEdit() {
    if (!editingSubmitted) return;
    restoreBaseline();
    if (currentSaveStatusEl) currentSaveStatusEl.textContent = T("part.status.noChanges");
    storeAnswers();
    drawState();
  }
  // The facilitator moved to another inject mid-change: the changes were
  // never sent, so the answer as submitted is what this phone keeps.
  function abandonEdit() {
    restoreBaseline();
  }

  // The time ran out while a submitted answer was being changed. What was
  // typed is sent as the change, so nothing is lost — unless nothing was
  // changed, or the box was left empty, in which case the answer as
  // submitted stands. If it can't be sent, the submitted answer stands too.
  async function finishEditAtTimeUp() {
    const idx = formIdx;
    const inject = formInject;
    const el = currentAnswerEl;
    const baseline = editBaseline;
    const text = el ? el.value : "";
    const files = attachments.slice();
    const changed = editDirty && (text.trim() !== "" || files.length > 0);
    editingSubmitted = false;
    editDirty = false;
    injectLocked = true;
    const putBack = () => {
      editBaseline = baseline;
      restoreBaseline();
    };
    if (!changed) {
      putBack();
      if (currentSaveStatusEl) currentSaveStatusEl.textContent = T("part.status.timesUpStands");
      storeAnswers();
      drawState();
      return;
    }
    editBaseline = null;
    if (currentSaveStatusEl) currentSaveStatusEl.textContent = T("part.status.timesUpSending");
    storeAnswers();
    drawState();
    try {
      await saveFor(idx, inject, { answerText: text, attachments: files, status: "submitted" });
      if (idx === formIdx && currentSaveStatusEl) currentSaveStatusEl.textContent = T("part.status.timesUpChangesSaved");
    } catch (err) {
      if (idx !== formIdx) {
        // Already on another inject: correct what this phone keeps for it.
        if (answersCache[idx] && baseline) {
          answersCache[idx].answerText = baseline.answerText || "";
          answersCache[idx].attachments = (baseline.attachments || []).slice();
          storeAnswers();
        }
        return;
      }
      putBack();
      if (currentSaveStatusEl) {
        currentSaveStatusEl.textContent = T("part.status.couldNotSendChanges");
      }
      storeAnswers();
      drawState();
    }
  }

  function renderAttachmentList() {
    const listEl = document.getElementById("attachmentList");
    if (!listEl) return;
    listEl.innerHTML = attachments
      .map(
        (a, i) => `<li><span>${escapeHtml(a.filename)}</span><button type="button" data-i="${i}" ${injectLocked ? "disabled" : ""}>${escapeHtml(T("part.attach.remove"))}</button></li>`
      )
      .join("");
    listEl.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (injectLocked) return;
        attachments.splice(Number(btn.dataset.i), 1);
        dirtyForCurrent = true;
        storeAnswers();
        renderAttachmentList();
        if (editingSubmitted) {
          editDirty = true;
          if (currentSaveStatusEl) currentSaveStatusEl.textContent = UNSENT_TEXT;
        } else {
          autosaveDraft(formIdx, formInject, currentAnswerEl, currentSaveStatusEl);
        }
      });
    });
  }

  async function autosaveDraft(idx, inject, answerEl, saveStatusEl) {
    if (submittedForCurrent || injectLocked) return;
    if (idx !== formIdx) return; // the inject changed while this save was waiting — the change handler already saved it
    try {
      await saveFor(idx, inject, {
        answerText: answerEl.value,
        attachments,
        status: reopenedSubmitted ? "submitted" : "draft",
      });
      if (saveStatusEl) saveStatusEl.textContent = T("part.status.saved");
    } catch (err) {
      if (saveStatusEl) saveStatusEl.textContent = T("part.status.saveFailed", { detail: String(PPLang.dbMessage(err.message)) });
    }
  }

  // Locks the on-screen form — normally when this inject's time runs out,
  // or (force) when the Facilitator re-locks it. Whatever this device wrote
  // is autosaved one last time (unless already explicitly submitted, or
  // nothing was written on this device — see dirtyForCurrent).
  function lockForCurrentInject(force, message) {
    if (!force && (injectLocked || submittedForCurrent)) return;
    injectLocked = true;
    editingSubmitted = false;
    editBaseline = null;
    clearTimeout(saveTimer);
    if (currentAnswerEl && !submittedForCurrent && dirtyForCurrent) {
      saveFor(formIdx, formInject, {
        answerText: currentAnswerEl.value,
        attachments,
        status: reopenedSubmitted ? "submitted" : "autosaved",
      }).catch((err) => console.warn("Autosave on lock failed:", err.message));
    }
    lockLabel = force ? T("part.lock.locked") : T("part.lock.timesUp");
    // Locked again by the facilitator after reopening a submitted answer: it
    // is a submitted answer again (and can be edited while time remains).
    if (force && reopenedSubmitted) {
      submittedForCurrent = true;
      reopenedSubmitted = false;
    }
    if (currentSaveStatusEl) {
      currentSaveStatusEl.textContent = message || (dirtyForCurrent
        ? T("part.status.timesUpSaved")
        : T("part.status.timesUp"));
    }
    storeAnswers();
    drawState();
  }

  // Reverses a lock by re-rendering the form as editable, keeping whatever
  // was last on screen.
  function unlockForCurrentInject(message, wasSubmitted, wasLocked) {
    if (!formInject) return;
    injectLocked = false;
    editingSubmitted = false;
    editBaseline = null;
    editDirty = false;
    const preservedAnswer = currentAnswerEl ? currentAnswerEl.value : "";
    renderForm(formInject, formIdx, { answerText: preservedAnswer });
    if (currentSaveStatusEl) {
      currentSaveStatusEl.textContent = message || T("part.status.moreTime");
    }
  }

  // ---- The countdown -----------------------------------------------------
  // Always shows the real time left for the inject (the server's start time
  // + its duration + any time added) — also after Submit, so a team that has
  // submitted can see how long it still has to change its answer. Amber in
  // the last minute, "Time's up" at zero.
  function updateClock() {
    const clockEl = document.getElementById("injectClock");
    const valueEl = document.getElementById("injectTimerValue");
    const noteEl = document.getElementById("injectTimerNote");
    const barEl = document.getElementById("injectTimerBar");
    if (!clockEl || !valueEl) return null;
    const deadline = currentDeadline();
    let remainingMs = null;
    if (!deadline) {
      clockEl.dataset.state = "none";
      valueEl.textContent = T("part.clock.noLimit");
    } else {
      remainingMs = deadline - Date.now();
      if (remainingMs <= 0) {
        clockEl.dataset.state = "up";
        valueEl.textContent = T("part.clock.timesUp");
        if (barEl) barEl.style.transform = "scaleX(0)";
      } else {
        const m = Math.floor(remainingMs / 60000);
        const s = Math.floor((remainingMs % 60000) / 1000);
        valueEl.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        clockEl.dataset.state = remainingMs < 60000 ? "warn" : "run";
        const totalMs = (((formInject && formInject.durationMinutes) || 0) + currentExtraMinutes) * 60000;
        if (barEl) barEl.style.transform = `scaleX(${totalMs > 0 ? Math.min(1, remainingMs / totalMs) : 1})`;
      }
    }
    if (noteEl) {
      const open = remainingMs === null || remainingMs > 0;
      noteEl.textContent = forceUnlocked
        ? T("part.clock.noteUnlocked")
        : editingSubmitted
          ? T("part.clock.noteEditing")
          : submittedForCurrent
            ? (open ? T("part.clock.noteSubmittedOpen") : T("part.clock.noteSubmitted"))
            : currentExtraMinutes > 0
              ? T("part.clock.noteExtra", { count: currentExtraMinutes })
              : "";
    }
    return remainingMs;
  }

  function onTimeUp() {
    if (forceUnlocked) return; // the facilitator's unlock has no deadline of its own
    if (submitting) return; // a Submit is on its way; its own result settles the state
    if (editingSubmitted) {
      finishEditAtTimeUp();
      return;
    }
    if (submittedForCurrent) {
      drawState(); // "Edit answer" goes
      return;
    }
    lockForCurrentInject(false);
  }

  // (Re)starts the once-a-second countdown for the inject on screen.
  function armTimer() {
    clearInjectTimer();
    let expired = false;
    function tick() {
      const remainingMs = updateClock();
      if (remainingMs !== null && remainingMs <= 0 && !expired) {
        expired = true;
        onTimeUp();
      }
    }
    tick();
    if (currentDeadline()) injectTimerInterval = setInterval(tick, 1000);
  }

  function clearInjectTimer() {
    if (injectTimerInterval) clearInterval(injectTimerInterval);
    injectTimerInterval = null;
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);
  }
</script>
</body>
</html>
