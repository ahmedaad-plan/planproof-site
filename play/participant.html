<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlanProof — Participant (prototype)</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --pp-navy: #0b1f3a;
    --pp-amber: #e8a33d;
    --pp-paper: #f4f1ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--pp-navy);
    color: var(--pp-paper);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; border-bottom: 1px solid rgba(244,241,234,0.15);
  }
  .brand { font-weight: 600; letter-spacing: 0.02em; }
  main { max-width: 640px; margin: 0 auto; padding: 24px; }
  .inject-card {
    background: rgba(244,241,234,0.06); border: 1px solid rgba(244,241,234,0.15);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .inject-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
  .inject-desc { opacity: 0.9; margin-bottom: 14px; }
  .timer { font-size: 0.85rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .timer.warn { color: var(--pp-amber); }
  .answer-card {
    background: var(--pp-paper); color: var(--pp-navy); border-radius: 12px; padding: 20px;
  }
  label { display: block; font-weight: 600; font-size: 0.85rem; margin: 0 0 6px; }
  textarea {
    width: 100%; min-height: 120px; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc;
    font-size: 1rem; font-family: inherit; resize: vertical; background: white; color: var(--pp-navy);
  }
  .attachments { margin-top: 14px; }
  .attachment-list { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.85rem; }
  .attachment-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; background: #f0eee7; border-radius: 6px; margin-bottom: 4px;
  }
  .attachment-list button { border: none; background: none; color: #a3271f; cursor: pointer; font-size: 0.9rem; }
  input[type="file"] { margin-top: 8px; }
  .save-status { font-size: 0.8rem; opacity: 0.65; margin-top: 10px; min-height: 1.2em; }
  .row-buttons { display: flex; gap: 10px; margin-top: 16px; }
  button.submit {
    flex: 1; font-size: 1.05rem; padding: 12px 18px; border-radius: 8px; border: none;
    background: var(--pp-navy); color: white; cursor: pointer;
  }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .submitted-banner {
    background: #e7f5e9; color: #1e5c28; border-radius: 8px; padding: 10px 14px;
    font-size: 0.9rem; margin-top: 14px;
  }
  .error {
    display: none; margin-top: 10px; padding: 10px 12px; border-radius: 8px;
    background: #fde4e1; color: #a3271f; font-size: 0.9rem;
  }
  .center-note { text-align: center; opacity: 0.85; padding: 60px 20px; font-size: 1.1rem; }
</style>
</head>
<body>
  <header>
    <div class="brand" id="clientLabel">PlanProof</div>
    <div class="brand" id="whoLabel" style="opacity:0.7; font-size:0.85rem;"></div>
  </header>
  <main id="main">Loading…</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared.js"></script>
<script>
  const sessionId = getSessionId();
  const mainEl = document.getElementById("main");
  const clientLabelEl = document.getElementById("clientLabel");
  const whoLabelEl = document.getElementById("whoLabel");

  let identity = null;
  let formIdx = null; // which inject index the on-screen form currently represents
  let attachments = []; // attachments already uploaded for the current inject
  let submittedForCurrent = false;
  let injectLocked = false; // true once Submit was clicked OR this inject's time ran out
  let currentExtraMinutes = 0; // the exercise_sessions.inject_extra_minutes value already applied to the running timer, for the inject currently on screen
  let forceUnlocked = false; // mirrors exercise_sessions.inject_force_unlocked for the inject currently on screen
  let saveTimer = null;
  let injectTimerInterval = null;
  // Client-side-only history of what this device had for each inject index,
  // so going back to an earlier inject (the Facilitator can move Previous,
  // then Unlock) restores what was there instead of a blank form. Purely
  // local — exercise_submissions' content columns stay write-only to anon
  // (see "Participant task submission" in design-notes.md), so this is
  // never re-read from the server. Lost on a page reload; the server copy
  // is unaffected either way.
  const answersCache = {};
  // References to the currently-rendered form's elements, so the timeout
  // handler (fired from startInjectTimer, outside renderForm's own closure)
  // can disable them without re-querying the DOM.
  let currentAnswerEl = null;
  let currentFileInput = null;
  let currentSubmitBtn = null;
  let currentSaveStatusEl = null;
  let currentInjectData = null; // the inject object currently on screen, so lockForCurrentInject/unlockForCurrentInject (called from outside render()'s closure) can rebuild the form

  if (!sessionId) {
    mainEl.innerHTML = `<div class="center-note">No ?session=&lt;id&gt; given in the URL.</div>`;
  } else {
    try {
      identity = JSON.parse(localStorage.getItem(`pp_identity_${sessionId}`) || "null");
    } catch {
      identity = null;
    }
    if (!identity || identity.role !== "participant") {
      mainEl.innerHTML = `<div class="center-note">You need to join this exercise first.
        <br/><a href="./join.html?session=${encodeURIComponent(sessionId)}" style="color:var(--pp-amber);">Join now</a></div>`;
    } else {
      whoLabelEl.textContent = `${identity.name} — ${identity.department}${identity.room ? ` — Room ${identity.room}` : ""}`;
      init();
    }
  }

  function init() {
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    fetchSession(sessionId).then(render).catch((err) => {
      mainEl.innerHTML = `<div class="center-note">Couldn't load session: ${escapeHtml(err.message)}</div>`;
    });
    subscribeToSession(supabaseClient, sessionId, render);
    onReconnect(() => {
      fetchSession(sessionId)
        .then(render)
        .catch((err) => console.warn("Resync after reconnect failed:", err.message));
    });
  }

  function render(row) {
    if (!row) return;
    clientLabelEl.textContent = row.label || "PlanProof";

    if (row.status === "ended") {
      clearInjectTimer();
      mainEl.innerHTML = `<div class="center-note">Exercise complete. Thank you for participating.</div>`;
      formIdx = null;
      return;
    }
    if (row.status === "lobby") {
      clearInjectTimer();
      mainEl.innerHTML = `<div class="center-note">Waiting for the facilitator to start the exercise…</div>`;
      formIdx = null;
      return;
    }

    const injects = (row.scenario && row.scenario.injects) || [];
    const idx = row.current_inject_index;
    const inject = injects[idx];
    if (!inject) {
      mainEl.innerHTML = `<div class="center-note">No inject at index ${idx}.</div>`;
      return;
    }
    currentInjectData = inject; // so lock/unlock helpers outside this closure can rebuild the form

    if (idx !== formIdx) {
      // Moving to a different inject (forward via Next, or backward via
      // Previous — the Facilitator can send a participant back to an
      // earlier inject at any time). Snapshot what's on screen right now
      // into the local cache before it's replaced, so coming back to THIS
      // inject later restores it instead of showing blank.
      if (formIdx !== null) {
        const lastAnswerEl = document.getElementById("answerText");
        answersCache[formIdx] = {
          answerText: lastAnswerEl ? lastAnswerEl.value : "",
          attachments: attachments.slice(),
          submitted: submittedForCurrent,
          locked: injectLocked,
        };
        // If it wasn't explicitly submitted or already locked, this is the
        // "facilitator moved on before they clicked Submit" moment — lock
        // in whatever they have as status=autosaved rather than losing it.
        if (!submittedForCurrent && !injectLocked && lastAnswerEl) {
          saveSubmission(sessionId, {
            injectIndex: formIdx,
            department: identity.department,
            answerText: lastAnswerEl.value,
            attachments,
            status: "autosaved",
          }).catch((err) => console.warn("Autosave on inject change failed:", err.message));
        }
      }

      formIdx = idx;
      currentExtraMinutes = row.inject_extra_minutes || 0;
      forceUnlocked = !!row.inject_force_unlocked;

      // Restore this inject's own history on this device, if any — e.g. the
      // Facilitator sent everyone back to an inject already submitted or
      // timed out. forceUnlocked (only ever true right after an explicit
      // Unlock, since it's reset on every navigation) means edit it fresh
      // regardless of that history.
      const cached = answersCache[idx];
      attachments = cached ? cached.attachments.slice() : [];
      submittedForCurrent = forceUnlocked ? false : cached ? cached.submitted : false;
      injectLocked = forceUnlocked ? false : cached ? cached.locked : false;

      renderForm(inject, idx, {
        answerText: cached ? cached.answerText : "",
        submitted: cached ? cached.submitted : false,
        locked: cached ? cached.locked : false,
      });

      if (!forceUnlocked && !submittedForCurrent && !injectLocked) {
        // Each inject's own duration (plus any extension already granted
        // before this device even loaded it) is a real deadline: once it
        // elapses, the participant can no longer edit or submit for THIS
        // inject, even if the facilitator hasn't advanced yet (the
        // facilitator-advance autosave above remains a second, later
        // safety net in case the facilitator advances before this fires).
        startInjectTimer((inject.durationMinutes || 0) + currentExtraMinutes, lockForCurrentInject);
      } else {
        clearInjectTimer();
      }
    } else {
      // Same inject still on screen. Two independent things the Facilitator
      // can change without navigating away — check both.
      const forceNow = !!row.inject_force_unlocked;
      if (forceNow !== forceUnlocked) {
        if (forceNow) {
          // Confirmed with Ahmed, 4 October 2026: unlocking must re-open
          // the form even if it was already submitted or timed out, and
          // allow resubmission. Capture what it was before clearing the
          // flags, so the rebuilt form can still mention the history.
          const wasSubmitted = submittedForCurrent;
          const wasLocked = injectLocked;
          forceUnlocked = true;
          submittedForCurrent = false;
          unlockForCurrentInject(
            "The facilitator has unlocked this inject — you can edit and resubmit.",
            wasSubmitted,
            wasLocked
          );
        } else {
          forceUnlocked = false;
          lockForCurrentInject(true, "The facilitator has locked this inject again.");
        }
      }

      // Extending time gives it back even if this device had already locked
      // the form on timeout — never applies once explicitly submitted, and
      // not while the Facilitator's manual unlock is already in effect (that
      // already allows editing regardless of any timer).
      const extraNow = row.inject_extra_minutes || 0;
      if (!forceUnlocked && extraNow > currentExtraMinutes && !submittedForCurrent) {
        currentExtraMinutes = extraNow;
        startInjectTimer((inject.durationMinutes || 0) + currentExtraMinutes, lockForCurrentInject);
        if (injectLocked) {
          unlockForCurrentInject("The facilitator added more time — you can continue.", false, true);
        }
      }
    }
  }

  function renderForm(inject, idx, initial) {
    initial = initial || {};
    mainEl.innerHTML = `
      <div class="inject-card">
        <div class="inject-title">${escapeHtml(inject.title)}</div>
        <div class="inject-desc">${escapeHtml(inject.desc)}</div>
        <div class="timer">Time for this inject: <span id="injectTimerValue">--:--</span></div>
      </div>
      <div class="answer-card">
        <label for="answerText">Your department's response</label>
        <textarea id="answerText" placeholder="What is ${escapeHtml(identity.department)} doing right now?">${escapeHtml(initial.answerText || "")}</textarea>
        <div class="attachments">
          <label>Attach documents (up to 3, 10MB each)</label>
          <input type="file" id="fileInput" multiple
            accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,image/jpeg,image/png,image/heic" />
          <ul class="attachment-list" id="attachmentList"></ul>
        </div>
        <div class="save-status" id="saveStatus"></div>
        <div class="error" id="errorBox"></div>
        <div class="row-buttons">
          <button class="submit" id="submitBtn">Submit answer</button>
        </div>
      </div>
    `;

    const answerEl = document.getElementById("answerText");
    const fileInput = document.getElementById("fileInput");
    const submitBtn = document.getElementById("submitBtn");
    const saveStatusEl = document.getElementById("saveStatus");
    const errorBoxEl = document.getElementById("errorBox");

    // So lockForCurrentInject (called from the timer, outside this closure)
    // can reach this exact form's elements.
    currentAnswerEl = answerEl;
    currentFileInput = fileInput;
    currentSubmitBtn = submitBtn;
    currentSaveStatusEl = saveStatusEl;

    answerEl.addEventListener("input", () => {
      if (injectLocked) return; // belt-and-suspenders: disabled fields shouldn't fire input anyway
      saveStatusEl.textContent = "Saving…";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => autosaveDraft(idx, answerEl, saveStatusEl), 1500);
    });

    fileInput.addEventListener("change", async () => {
      if (injectLocked) return;
      const files = Array.from(fileInput.files || []);
      fileInput.value = "";
      if (attachments.length + files.length > 3) {
        errorBoxEl.textContent = "You can attach at most 3 documents.";
        errorBoxEl.style.display = "block";
        return;
      }
      for (const file of files) {
        if (file.size > 10 * 1024 * 1024) {
          errorBoxEl.textContent = `"${file.name}" is over 10MB — not attached.`;
          errorBoxEl.style.display = "block";
          continue;
        }
        try {
          saveStatusEl.textContent = `Uploading ${file.name}…`;
          const uploaded = await uploadAttachment(sessionId, idx, identity.department, file);
          attachments.push(uploaded);
          renderAttachmentList();
          await autosaveDraft(idx, answerEl, saveStatusEl);
        } catch (err) {
          errorBoxEl.textContent = err.message;
          errorBoxEl.style.display = "block";
        }
      }
    });

    submitBtn.addEventListener("click", async () => {
      if (injectLocked) return; // time ran out before the click was processed
      errorBoxEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting…";
      try {
        await saveSubmission(sessionId, {
          injectIndex: idx,
          department: identity.department,
          answerText: answerEl.value,
          attachments,
          status: "submitted",
        });
        submittedForCurrent = true;
        injectLocked = true; // locked unless/until the Facilitator explicitly unlocks this inject
        answerEl.disabled = true;
        fileInput.disabled = true;
        saveStatusEl.textContent = "";
        document.querySelector(".row-buttons").insertAdjacentHTML(
          "beforebegin",
          `<div class="submitted-banner">✓ Submitted for ${escapeHtml(identity.department)}.</div>`
        );
        submitBtn.remove();
      } catch (err) {
        errorBoxEl.textContent = err.message;
        errorBoxEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit answer";
      }
    });

    // Apply whatever state this inject was already in — e.g. the Facilitator
    // sent everyone back to an inject already submitted or timed out on this
    // device. forceUnlocked overrides all of it (the caller already reset
    // submittedForCurrent/injectLocked to false in that case) — just note
    // the history so it isn't a surprise.
    if (forceUnlocked) {
      if (initial.submitted || initial.locked) {
        saveStatusEl.textContent =
          `Unlocked by the facilitator — previously ${initial.submitted ? "submitted" : "timed out"}; you can edit and resubmit.`;
      }
    } else if (initial.submitted) {
      answerEl.disabled = true;
      fileInput.disabled = true;
      document.querySelector(".row-buttons").insertAdjacentHTML(
        "beforebegin",
        `<div class="submitted-banner">✓ Submitted for ${escapeHtml(identity.department)}.</div>`
      );
      submitBtn.remove();
    } else if (initial.locked) {
      answerEl.disabled = true;
      fileInput.disabled = true;
      submitBtn.disabled = true;
      submitBtn.textContent = "Time's up";
      saveStatusEl.textContent =
        "Time's up for this inject — your response has been saved automatically.";
    }

    renderAttachmentList();
  }

  function renderAttachmentList() {
    const listEl = document.getElementById("attachmentList");
    if (!listEl) return;
    listEl.innerHTML = attachments
      .map(
        (a, i) => `<li><span>${escapeHtml(a.filename)}</span><button data-i="${i}">Remove</button></li>`
      )
      .join("");
    listEl.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        attachments.splice(Number(btn.dataset.i), 1);
        renderAttachmentList();
      });
    });
  }

  async function autosaveDraft(idx, answerEl, saveStatusEl) {
    if (submittedForCurrent || injectLocked) return;
    try {
      await saveSubmission(sessionId, {
        injectIndex: idx,
        department: identity.department,
        answerText: answerEl.value,
        attachments,
        status: "draft",
      });
      if (saveStatusEl) saveStatusEl.textContent = "Saved.";
    } catch (err) {
      if (saveStatusEl) saveStatusEl.textContent = `Couldn't save: ${err.message}`;
    }
  }

  // Locks the on-screen form — normally the moment this inject's own timer
  // runs out, but `force` also lets the Facilitator's "Lock this inject"
  // toggle re-lock it on demand (confirmed with Ahmed, 4 October 2026),
  // even with no new timeout or submit involved. Whatever's on screen at
  // that instant is autosaved one last time (unless already explicitly
  // submitted — that answer stays as submitted, not overwritten with a
  // draft), then the textarea, file input, and Submit button are disabled.
  function lockForCurrentInject(force, message) {
    if (!force && (injectLocked || submittedForCurrent)) return;
    injectLocked = true;
    if (currentAnswerEl) {
      if (!submittedForCurrent) {
        saveSubmission(sessionId, {
          injectIndex: formIdx,
          department: identity.department,
          answerText: currentAnswerEl.value,
          attachments,
          status: "autosaved",
        }).catch((err) => console.warn("Autosave on lock failed:", err.message));
      }
      currentAnswerEl.disabled = true;
    }
    if (currentFileInput) currentFileInput.disabled = true;
    if (currentSubmitBtn) {
      currentSubmitBtn.disabled = true;
      currentSubmitBtn.textContent = force ? "Locked" : "Time's up";
    }
    if (currentSaveStatusEl) {
      currentSaveStatusEl.textContent =
        message || "Time's up for this inject — your response has been saved automatically.";
    }
  }

  // Reverses a lock — whether from this inject's own timeout, or from an
  // explicit Submit (which show different DOM: Submit locks by removing the
  // button and inserting a banner, not just disabling fields) — by fully
  // re-rendering the form as editable, with whatever was last on screen
  // preserved. Triggered by a time extension (timeout-locks only) or by the
  // Facilitator's explicit "Unlock this inject" (any lock, including an
  // already-submitted answer — confirmed with Ahmed, 4 October 2026: an
  // extension gives the time back exactly as if the inject had been that
  // long from the start; an explicit unlock re-opens it for editing and
  // resubmission regardless of why it was locked).
  function unlockForCurrentInject(message, wasSubmitted, wasLocked) {
    if (!currentInjectData) return;
    injectLocked = false;
    const preservedAnswer = currentAnswerEl ? currentAnswerEl.value : "";
    // submitted/locked here are passed through only so renderForm can note
    // the history (e.g. "previously submitted") when forceUnlocked is what
    // made this editable again — they are NOT re-applied as the active
    // lock state, since the whole point of this call is to make the form
    // editable right now.
    renderForm(currentInjectData, formIdx, {
      answerText: preservedAnswer,
      submitted: !!wasSubmitted,
      locked: !!wasLocked,
    });
    if (currentSaveStatusEl) {
      currentSaveStatusEl.textContent = message || "The facilitator added more time — you can continue.";
    }
  }

  function startInjectTimer(minutes, onExpire) {
    clearInjectTimer();
    const end = Date.now() + minutes * 60 * 1000;
    let expired = false;
    function tick() {
      const el = document.getElementById("injectTimerValue");
      const remainingMs = end - Date.now();
      if (el) {
        const sign = remainingMs < 0 ? "-" : "";
        const abs = Math.abs(remainingMs);
        const m = Math.floor(abs / 60000);
        const s = Math.floor((abs % 60000) / 1000);
        el.textContent = `${sign}${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        el.classList.toggle("warn", remainingMs < 0);
      }
      // minutes > 0 guard: an inject with no duration set shouldn't lock the
      // form the instant it renders — treat it as having no deadline.
      if (!expired && minutes > 0 && remainingMs <= 0) {
        expired = true;
        if (onExpire) onExpire();
      }
    }
    tick();
    injectTimerInterval = setInterval(tick, 1000);
  }

  function clearInjectTimer() {
    if (injectTimerInterval) clearInterval(injectTimerInterval);
    injectTimerInterval = null;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }
</script>
</body>
</html>
