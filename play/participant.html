<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlanProof — Participant (prototype)</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --pp-navy: #0b1f3a;
    --pp-amber: #e8a33d;
    --pp-paper: #f4f1ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--pp-navy);
    color: var(--pp-paper);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 16px 24px; border-bottom: 1px solid rgba(244,241,234,0.15);
  }
  .brand { font-weight: 600; letter-spacing: 0.02em; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  .inject-card {
    background: rgba(244,241,234,0.06); border: 1px solid rgba(244,241,234,0.15);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .inject-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
  .inject-desc { opacity: 0.9; margin-bottom: 14px; }
  .inject-task {
    background: rgba(232,163,61,0.15); border-left: 3px solid var(--pp-amber);
    padding: 8px 12px; border-radius: 4px; margin-bottom: 14px; font-size: 0.95rem;
  }
  .task-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag {
    font-size: 0.75rem; padding: 3px 9px; border-radius: 999px;
    border: 1px solid rgba(244,241,234,0.35); opacity: 0.9;
  }
  .tag.individual { border-color: var(--pp-amber); color: var(--pp-amber); }
  .timer { font-size: 0.85rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .timer.warn { color: var(--pp-amber); opacity: 1; }
  .answer-card {
    background: var(--pp-paper); color: var(--pp-navy); border-radius: 12px; padding: 20px;
  }
  .not-required {
    background: #eef1f5; color: #3b4a5e; border-radius: 8px; padding: 10px 12px;
    font-size: 0.85rem; margin-bottom: 12px;
  }
  label { display: block; font-weight: 600; font-size: 0.85rem; margin: 0 0 6px; }
  .hint { font-size: 0.8rem; opacity: 0.7; margin: -2px 0 8px; }
  textarea {
    width: 100%; min-height: 120px; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc;
    font-size: 1rem; font-family: inherit; resize: vertical; background: white; color: var(--pp-navy);
  }
  .attachments { margin-top: 14px; }
  .attachment-list { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.85rem; }
  .attachment-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; background: #f0eee7; border-radius: 6px; margin-bottom: 4px;
  }
  .attachment-list button { border: none; background: none; color: #a3271f; cursor: pointer; font-size: 0.9rem; }
  input[type="file"] { margin-top: 8px; max-width: 100%; }
  .save-status { font-size: 0.8rem; opacity: 0.65; margin-top: 10px; min-height: 1.2em; }
  .row-buttons { display: flex; gap: 10px; margin-top: 16px; }
  button.submit {
    flex: 1; font-size: 1.05rem; padding: 12px 18px; border-radius: 8px; border: none;
    background: var(--pp-navy); color: white; cursor: pointer;
  }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .submitted-banner {
    background: #e7f5e9; color: #1e5c28; border-radius: 8px; padding: 10px 14px;
    font-size: 0.9rem; margin-top: 14px;
  }
  .error {
    display: none; margin-top: 10px; padding: 10px 12px; border-radius: 8px;
    background: #fde4e1; color: #a3271f; font-size: 0.9rem;
  }
  .center-note { text-align: center; opacity: 0.85; padding: 60px 20px; font-size: 1.1rem; }

  /* Facilitator messages (added 5 October 2026). The banner and the list sit
     outside <main>, which is redrawn on every update. */
  .msg-banner { display: none; background: var(--pp-amber); color: var(--pp-navy); }
  .msg-banner.show { display: block; }
  .msg-banner-inner {
    max-width: 640px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .msg-banner-inner > div { flex: 1; min-width: 0; }
  .msg-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; opacity: 0.75; }
  .msg-text { font-size: 1.05rem; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
  .msg-banner button {
    flex: 0 0 auto; border: 1px solid var(--pp-navy); background: transparent; color: var(--pp-navy);
    border-radius: 8px; padding: 8px 12px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
  }
  .msg-history { max-width: 640px; margin: 0 auto; padding: 0 16px 32px; }
  .msg-history summary { cursor: pointer; font-size: 0.9rem; opacity: 0.85; padding: 8px 0; }
  .msg-badge {
    display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px;
    background: var(--pp-amber); color: var(--pp-navy); font-size: 0.75rem; font-weight: 700;
  }
  .msg-list { list-style: none; margin: 4px 0 0; padding: 0; font-size: 0.9rem; }
  .msg-list li { padding: 8px 0; border-top: 1px solid rgba(244,241,234,0.15); overflow-wrap: anywhere; }
  .msg-list .meta { opacity: 0.6; font-size: 0.8rem; display: block; }
  .msg-list li.unread { font-weight: 600; }

  /* Message the facilitator (roadmap item 4, added 7 October 2026). */
  .msg-reply { max-width: 640px; margin: 0 auto; padding: 0 16px 32px; }
  .msg-reply-card {
    background: rgba(244,241,234,0.06); border: 1px solid rgba(244,241,234,0.15);
    border-radius: 12px; padding: 16px;
  }
  .msg-reply-label { font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; }
  .msg-reply select, .msg-reply textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc;
    font-size: 0.95rem; font-family: inherit; box-sizing: border-box; margin-top: 6px;
    background: var(--pp-paper); color: var(--pp-navy);
  }
  .msg-reply textarea { min-height: 56px; resize: vertical; }
  .msg-reply-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
  .msg-reply-row .count { font-size: 0.8rem; opacity: 0.6; }
  .msg-reply-row button {
    border: none; border-radius: 8px; padding: 10px 18px; font-size: 1rem; font-weight: 600;
    background: var(--pp-amber); color: var(--pp-navy); cursor: pointer;
  }
  .msg-reply-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg-reply-feedback { font-size: 0.85rem; margin-top: 8px; min-height: 1.1em; }
  .msg-reply-feedback.ok { color: #9be3a8; }
  .msg-reply-feedback.err { color: #ffb3a8; }
</style>
</head>
<body>
  <header>
    <div class="brand" id="clientLabel">PlanProof</div>
    <div class="brand" id="whoLabel" style="opacity:0.7; font-size:0.85rem; text-align:right;"></div>
  </header>
  <div class="msg-banner" id="msgBanner" role="status" aria-live="polite">
    <div class="msg-banner-inner">
      <div>
        <div class="msg-label">Message from the facilitator <span id="msgBannerTime"></span></div>
        <div class="msg-text" id="msgBannerText"></div>
      </div>
      <button id="msgBannerOk">Got it</button>
    </div>
  </div>
  <main id="main">Loading…</main>
  <section class="msg-history" id="msgHistory" hidden>
    <details id="msgHistoryDetails">
      <summary>Messages from the facilitator<span class="msg-badge" id="msgBadge" hidden></span></summary>
      <ul class="msg-list" id="msgList"></ul>
    </details>
  </section>
  <section class="msg-reply" id="msgReply" hidden>
    <div class="msg-reply-card">
      <div class="msg-reply-label">Message the facilitator</div>
      <select id="replyPreset"><option value="">— Choose a ready-made message —</option></select>
      <textarea id="replyText" maxlength="280" placeholder="Type a message, or choose one above and edit it"></textarea>
      <div class="msg-reply-row">
        <span class="count" id="replyCount">0 / 280</span>
        <button id="replySendBtn" disabled>Send &rarr;</button>
      </div>
      <div class="msg-reply-feedback" id="replyFeedback"></div>
    </div>
  </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared.js"></script>
<script>
  const sessionId = getSessionId();
  const mainEl = document.getElementById("main");
  const clientLabelEl = document.getElementById("clientLabel");
  const whoLabelEl = document.getElementById("whoLabel");

  let identity = null;
  let formIdx = null; // which inject index the on-screen form currently represents
  let formInject = null; // the inject object for formIdx (kept separately so leaving an inject saves under ITS group/individual type, not the next one's)
  let attachments = []; // attachments already uploaded for the current inject
  let submittedForCurrent = false;
  let injectLocked = false; // true once Submit was clicked OR this inject's time ran out
  // True once this device has actually typed or attached something for the
  // current inject. The automatic saves (on timeout, or when the facilitator
  // moves on) only fire when this is true — otherwise a phone that reloaded
  // mid-exercise (and so shows a blank form) would overwrite the answer
  // already saved on the server with an empty one.
  let dirtyForCurrent = false;
  // True while the Facilitator has unlocked an answer this device had
  // already SUBMITTED. Edits made then are amendments to a submitted answer,
  // so they're saved as "submitted" — otherwise reopening it would quietly
  // turn an on-time answer back into an unsubmitted draft on the dashboard.
  let reopenedSubmitted = false;
  let currentExtraMinutes = 0; // the exercise_sessions.inject_extra_minutes value already applied to the running timer, for the inject currently on screen
  let forceUnlocked = false; // mirrors exercise_sessions.inject_force_unlocked for the inject currently on screen
  let latestRow = null;
  let saveTimer = null;
  let injectTimerInterval = null;
  // Client-side-only history of what this device had for each inject index,
  // so going back to an earlier inject (the Facilitator can move Previous,
  // then Unlock) restores what was there instead of a blank form. Purely
  // local — answer text and attachments are write-only for every browser
  // (see "Participant task submission" in design-notes.md), so this is
  // never re-read from the server. Lost on a page reload; the server copy
  // is unaffected either way.
  const answersCache = {};
  let currentAnswerEl = null;
  let currentFileInput = null;
  let currentSubmitBtn = null;
  let currentSaveStatusEl = null;

  if (!sessionId) {
    mainEl.innerHTML = `<div class="center-note">No ?session=&lt;id&gt; given in the URL.</div>`;
  } else {
    try {
      identity = JSON.parse(localStorage.getItem(`pp_identity_${sessionId}`) || "null");
    } catch {
      identity = null;
    }
    const joinLink = `./join.html?session=${encodeURIComponent(sessionId)}`;
    if (!identity || identity.role !== "participant") {
      mainEl.innerHTML = `<div class="center-note">You need to join this exercise first.
        <br/><a href="${joinLink}" style="color:var(--pp-amber);">Join now</a></div>`;
    } else if (!identity.attendeeId) {
      // Registered before registration asked for first/family name and job
      // title, and before individual answers existed — no attendee id to
      // file an individual answer under.
      mainEl.innerHTML = `<div class="center-note">Registration has been updated — please register again.
        <br/><a href="${joinLink}" style="color:var(--pp-amber);">Register</a></div>`;
    } else {
      whoLabelEl.textContent = `${identity.name} — ${identity.department}${identity.room ? ` — Room ${identity.room}` : ""}`;
      init();
    }
  }

  function init() {
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    fetchSession(sessionId).then(render).catch((err) => {
      mainEl.innerHTML = `<div class="center-note">Couldn't load session: ${escapeHtml(err.message)}</div>`;
    });
    subscribeToSession(supabaseClient, sessionId, render);
    loadMessages();
    subscribeToMessages(supabaseClient, sessionId, onNewMessage);
    initReply();
    onReconnect(() => {
      fetchSession(sessionId)
        .then(render)
        .catch((err) => console.warn("Resync after reconnect failed:", err.message));
      loadMessages();
    });
  }

  // ---- Messages from the facilitator (added 5 October 2026) -------------
  // A banner for the newest unread message, a list of every message, and an
  // unread count. Phones stay silent (in-room devices don't play sound — the
  // room display chimes); a short vibration is tried where the phone
  // supports it. The banner goes when the person taps "Got it" or the
  // inject changes; the message stays in the list.
  const msgBannerEl = document.getElementById("msgBanner");
  const msgBannerTextEl = document.getElementById("msgBannerText");
  const msgBannerTimeEl = document.getElementById("msgBannerTime");
  const msgHistoryEl = document.getElementById("msgHistory");
  const msgBadgeEl = document.getElementById("msgBadge");
  const msgListEl = document.getElementById("msgList");
  const baseTitle = document.title;
  let messages = [];
  const readKey = `pp_msgread_${sessionId}`;
  let lastReadAt = null; // created_at (ms) of the newest message this person has acknowledged
  try {
    const stored = localStorage.getItem(readKey);
    lastReadAt = stored ? Number(stored) : null;
  } catch {
    lastReadAt = null;
  }

  document.getElementById("msgBannerOk").addEventListener("click", markAllRead);
  document.getElementById("msgHistoryDetails").addEventListener("toggle", (e) => {
    if (e.target.open) markAllRead();
  });

  // Messages for everyone, plus (from roadmap item 4) ones for this person's
  // own department.
  function isForMe(m) {
    if (!m.department) return true;
    return (
      String(m.department).trim().toLowerCase() ===
      String(identity.department || "").trim().toLowerCase()
    );
  }
  const msgTime = (m) => new Date(m.created_at).getTime();
  const msgContext = (m) => (m.inject_index === undefined ? null : m.inject_index);
  function currentContext() {
    return latestRow && latestRow.status === "running" ? latestRow.current_inject_index : null;
  }
  // With no saved read marker (first visit, or storage blocked), only
  // messages sent for what's showing now count as new — older ones are
  // treated as already read rather than all lighting up at once.
  function isUnread(m) {
    if (lastReadAt !== null) return msgTime(m) > lastReadAt;
    return msgContext(m) === currentContext();
  }

  async function loadMessages() {
    try {
      messages = (await fetchMessages(sessionId)).filter(isForMe);
      renderMessages();
    } catch (err) {
      console.warn("Couldn't load messages:", err.message);
    }
  }

  function onNewMessage(m) {
    if (!isForMe(m) || messages.some((x) => x.id === m.id)) return;
    messages.push(m);
    messages.sort((a, b) => msgTime(a) - msgTime(b));
    renderMessages();
    try {
      if (navigator.vibrate) navigator.vibrate(200);
    } catch {
      /* not supported — the banner is enough */
    }
  }

  function markAllRead() {
    if (messages.length) {
      lastReadAt = Math.max(...messages.map(msgTime));
      try {
        localStorage.setItem(readKey, String(lastReadAt));
      } catch {
        /* storage blocked — still marked read for this page */
      }
    }
    renderMessages();
  }

  function renderMessages() {
    msgHistoryEl.hidden = messages.length === 0;
    const unread = messages.filter(isUnread);
    msgBadgeEl.hidden = unread.length === 0;
    msgBadgeEl.textContent = unread.length === 1 ? "1 new" : `${unread.length} new`;
    document.title = unread.length ? `(${unread.length}) ${baseTitle}` : baseTitle;

    msgListEl.innerHTML = messages
      .slice()
      .reverse()
      .map(
        (m) => `<li class="${isUnread(m) ? "unread" : ""}"><span class="meta">${escapeHtml(formatMessageTime(m.created_at))}</span>${escapeHtml(m.body)}</li>`
      )
      .join("");

    // Banner: the newest unread message, only while its inject is still
    // the one showing (and never after the exercise has ended).
    const ended = latestRow && latestRow.status === "ended";
    const newestUnread = unread[unread.length - 1];
    if (!ended && newestUnread && msgContext(newestUnread) === currentContext()) {
      msgBannerTextEl.textContent = newestUnread.body;
      msgBannerTimeEl.textContent = `· ${formatMessageTime(newestUnread.created_at)}`;
      msgBannerEl.classList.add("show");
    } else {
      msgBannerEl.classList.remove("show");
    }
  }

  // ---- Message the facilitator (roadmap item 4, added 7 October 2026) ---
  // Same editable-dropdown pattern as the facilitator's own message boxes.
  // Sent as this person's department (self-declared, no individual stored —
  // the same trust model a group answer already uses), so it reaches the
  // facilitator as "Finance" or whichever department, never this person's
  // name.
  function initReply() {
    const sectionEl = document.getElementById("msgReply");
    const presetEl = document.getElementById("replyPreset");
    const textEl = document.getElementById("replyText");
    const countEl = document.getElementById("replyCount");
    const sendBtn = document.getElementById("replySendBtn");
    const feedbackEl = document.getElementById("replyFeedback");
    let sending = false;

    DEPARTMENT_TO_FACILITATOR_PRESETS.forEach((p) => {
      const opt = document.createElement("option");
      opt.value = p.key;
      opt.textContent = p.text;
      presetEl.appendChild(opt);
    });

    function updateControls() {
      const len = textEl.value.trim().length;
      countEl.textContent = `${textEl.value.length} / ${MESSAGE_MAX_LENGTH}`;
      const ended = latestRow && latestRow.status === "ended";
      sendBtn.disabled = sending || len === 0 || ended;
      presetEl.disabled = ended;
      textEl.disabled = ended;
      if (ended) feedbackEl.textContent = "The exercise has ended — messages can no longer be sent.";
    }

    presetEl.addEventListener("change", () => {
      const preset = DEPARTMENT_TO_FACILITATOR_PRESETS.find((p) => p.key === presetEl.value);
      if (preset) textEl.value = preset.text;
      feedbackEl.textContent = "";
      feedbackEl.className = "msg-reply-feedback";
      updateControls();
      textEl.focus();
    });
    textEl.addEventListener("input", () => {
      feedbackEl.textContent = "";
      feedbackEl.className = "msg-reply-feedback";
      updateControls();
    });

    sendBtn.addEventListener("click", async () => {
      const body = textEl.value.trim();
      if (!body) return;
      const preset = DEPARTMENT_TO_FACILITATOR_PRESETS.find((p) => p.key === presetEl.value);
      const presetKey = preset && preset.text === body ? preset.key : null;
      sending = true;
      updateControls();
      feedbackEl.className = "msg-reply-feedback";
      feedbackEl.textContent = "Sending…";
      try {
        await sendDepartmentRequest(sessionId, { body, presetKey, department: identity.department });
        textEl.value = "";
        presetEl.value = "";
        feedbackEl.className = "msg-reply-feedback ok";
        feedbackEl.textContent = `Sent to the facilitator at ${formatMessageTime(new Date().toISOString())} ✓`;
      } catch (err) {
        feedbackEl.className = "msg-reply-feedback err";
        feedbackEl.textContent = err.message;
      } finally {
        sending = false;
        updateControls();
      }
    });

    sectionEl.hidden = false;
    updateControls();
    // Re-checked on every session row update (render() calls renderMessages,
    // which doesn't touch this section) — status changing to "ended" should
    // disable sending even without the person touching the form.
    setInterval(updateControls, 5000);
  }

  function isIndividual(inject) {
    return injectOutput(inject) === "individual";
  }

  // Every save goes through here so a group inject is saved as the
  // department's shared answer and an individual inject as this person's
  // own answer.
  function saveFor(idx, inject, fields) {
    return saveSubmission(sessionId, {
      injectIndex: idx,
      department: identity.department,
      attendeeId: isIndividual(inject) ? identity.attendeeId : null,
      ...fields,
    });
  }

  function render(row) {
    if (!row) return;
    latestRow = row;
    clientLabelEl.textContent = row.label || "PlanProof";
    // The message banner follows what's showing (hides on inject change).
    renderMessages();

    if (row.status === "ended") {
      clearInjectTimer();
      mainEl.innerHTML = `<div class="center-note">Exercise complete. Thank you for participating.</div>`;
      formIdx = null;
      formInject = null;
      return;
    }
    if (row.status === "lobby") {
      clearInjectTimer();
      mainEl.innerHTML = `<div class="center-note">Waiting for the facilitator to start the exercise…</div>`;
      formIdx = null;
      formInject = null;
      return;
    }

    const injects = (row.scenario && row.scenario.injects) || [];
    const idx = row.current_inject_index;
    const inject = injects[idx];
    if (!inject) {
      mainEl.innerHTML = `<div class="center-note">No inject at index ${idx}.</div>`;
      return;
    }

    if (idx !== formIdx) {
      // Moving to a different inject (forward via Next, or backward via
      // Previous). Snapshot what's on screen into the local cache first, so
      // coming back to THIS inject later restores it instead of showing blank.
      if (formIdx !== null) {
        const lastAnswerEl = document.getElementById("answerText");
        answersCache[formIdx] = {
          answerText: lastAnswerEl ? lastAnswerEl.value : "",
          attachments: attachments.slice(),
          submitted: submittedForCurrent,
          locked: injectLocked,
          dirty: dirtyForCurrent,
        };
        // "Facilitator moved on before they clicked Submit" — keep whatever
        // they wrote as status=autosaved rather than losing it. Saved under
        // the inject being LEFT (formInject), not the new one.
        if (!submittedForCurrent && !injectLocked && dirtyForCurrent && lastAnswerEl) {
          saveFor(formIdx, formInject, {
            answerText: lastAnswerEl.value,
            attachments,
            status: reopenedSubmitted ? "submitted" : "autosaved",
          }).catch((err) => console.warn("Autosave on inject change failed:", err.message));
        }
      }

      reopenedSubmitted = false;
      formIdx = idx;
      formInject = inject;
      currentExtraMinutes = row.inject_extra_minutes || 0;
      forceUnlocked = !!row.inject_force_unlocked;

      const cached = answersCache[idx];
      attachments = cached ? cached.attachments.slice() : [];
      submittedForCurrent = forceUnlocked ? false : cached ? cached.submitted : false;
      injectLocked = forceUnlocked ? false : cached ? cached.locked : false;
      dirtyForCurrent = cached ? cached.dirty : false;

      renderForm(inject, idx, {
        answerText: cached ? cached.answerText : "",
        submitted: cached ? cached.submitted : false,
        locked: cached ? cached.locked : false,
      });

      if (!forceUnlocked && !submittedForCurrent && !injectLocked) {
        // The deadline comes from the server's start time for this inject
        // (plus any extension), so it's the same deadline the database uses
        // to decide "on time" — and a phone that reloads mid-inject picks
        // the countdown up where it really is, instead of restarting it.
        startInjectTimer(injectDeadlineMs(row, inject), () => lockForCurrentInject(false));
      } else {
        startInjectTimer(null, null);
      }
    } else {
      formInject = inject;
      const forceNow = !!row.inject_force_unlocked;
      if (forceNow !== forceUnlocked) {
        if (forceNow) {
          const wasSubmitted = submittedForCurrent;
          const wasLocked = injectLocked;
          forceUnlocked = true;
          submittedForCurrent = false;
          reopenedSubmitted = reopenedSubmitted || wasSubmitted;
          unlockForCurrentInject(
            "The facilitator has unlocked this inject — you can edit and resubmit.",
            wasSubmitted,
            wasLocked
          );
          startInjectTimer(null, null); // an explicit unlock has no deadline of its own
        } else {
          forceUnlocked = false;
          lockForCurrentInject(true, "The facilitator has locked this inject again.");
          startInjectTimer(null, null);
        }
      }

      // Extending time gives it back even if this device had already locked
      // the form on timeout — never once explicitly submitted, and not while
      // the Facilitator's manual unlock is in effect.
      const extraNow = row.inject_extra_minutes || 0;
      if (!forceUnlocked && extraNow > currentExtraMinutes && !submittedForCurrent) {
        currentExtraMinutes = extraNow;
        const deadline = injectDeadlineMs(row, inject);
        if (injectLocked && deadline && deadline > Date.now()) {
          unlockForCurrentInject("The facilitator added more time — you can continue.", false, true);
        }
        if (!injectLocked) {
          startInjectTimer(deadline, () => lockForCurrentInject(false));
        }
      }
    }
  }

  function renderForm(inject, idx, initial) {
    initial = initial || {};
    const individual = isIndividual(inject);
    const responsible = isDepartmentResponsible(inject, identity.department);
    const responsibleList = injectResponsible(inject);
    const responsibleText = responsibleList.some((d) => String(d).toLowerCase() === "all")
      ? "All departments"
      : responsibleList.join(", ");

    mainEl.innerHTML = `
      <div class="inject-card">
        <div class="task-tags">
          <span class="tag ${individual ? "individual" : ""}">${individual ? "Individual task — everyone answers" : "Group task — one answer per department"}</span>
          <span class="tag">Responsible: ${escapeHtml(responsibleText)}</span>
        </div>
        <div class="inject-title">${escapeHtml(inject.title)}</div>
        <div class="inject-desc">${escapeHtml(inject.desc)}</div>
        ${injectTaskText(inject) ? `<div class="inject-task">${escapeHtml(injectTaskText(inject))}</div>` : ""}
        <div class="timer">Time for this inject: <span id="injectTimerValue">--:--</span></div>
      </div>
      <div class="answer-card">
        ${responsible ? "" : `<div class="not-required">Your department isn't named as responsible for this inject, so no answer is required from you. You can still add input if it's relevant.</div>`}
        <label for="answerText">${individual ? "Your own response" : `${escapeHtml(identity.department)}'s response`}</label>
        <div class="hint">${individual
          ? "Answer for yourself — each person in your department submits their own."
          : `Anyone in ${escapeHtml(identity.department)} can write and submit this one shared answer.`}</div>
        <textarea id="answerText" placeholder="${individual ? "Your answer" : `What is ${escapeHtml(identity.department)} doing right now?`}">${escapeHtml(initial.answerText || "")}</textarea>
        <div class="attachments">
          <label>Attach documents (up to 3, 10MB each)</label>
          <input type="file" id="fileInput" multiple
            accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,image/jpeg,image/png,image/heic" />
          <ul class="attachment-list" id="attachmentList"></ul>
        </div>
        <div class="save-status" id="saveStatus"></div>
        <div class="error" id="errorBox"></div>
        <div class="row-buttons">
          <button class="submit" id="submitBtn">Submit answer</button>
        </div>
      </div>
    `;

    const answerEl = document.getElementById("answerText");
    const fileInput = document.getElementById("fileInput");
    const submitBtn = document.getElementById("submitBtn");
    const saveStatusEl = document.getElementById("saveStatus");
    const errorBoxEl = document.getElementById("errorBox");

    currentAnswerEl = answerEl;
    currentFileInput = fileInput;
    currentSubmitBtn = submitBtn;
    currentSaveStatusEl = saveStatusEl;

    const submittedText = individual
      ? "✓ Your answer is submitted."
      : `✓ Submitted for ${escapeHtml(identity.department)}.`;

    answerEl.addEventListener("input", () => {
      if (injectLocked) return;
      dirtyForCurrent = true;
      saveStatusEl.textContent = "Saving…";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => autosaveDraft(idx, inject, answerEl, saveStatusEl), 1500);
    });

    fileInput.addEventListener("change", async () => {
      if (injectLocked) return;
      const files = Array.from(fileInput.files || []);
      fileInput.value = "";
      if (attachments.length + files.length > 3) {
        errorBoxEl.textContent = "You can attach at most 3 documents.";
        errorBoxEl.style.display = "block";
        return;
      }
      for (const file of files) {
        if (file.size > 10 * 1024 * 1024) {
          errorBoxEl.textContent = `"${file.name}" is over 10MB — not attached.`;
          errorBoxEl.style.display = "block";
          continue;
        }
        try {
          saveStatusEl.textContent = `Uploading ${file.name}…`;
          const uploaded = await uploadAttachment(sessionId, idx, identity.department, file);
          attachments.push(uploaded);
          dirtyForCurrent = true;
          renderAttachmentList();
          await autosaveDraft(idx, inject, answerEl, saveStatusEl);
        } catch (err) {
          errorBoxEl.textContent = err.message;
          errorBoxEl.style.display = "block";
        }
      }
    });

    submitBtn.addEventListener("click", async () => {
      if (injectLocked) return; // time ran out before the click was processed
      errorBoxEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting…";
      try {
        clearTimeout(saveTimer); // a pending draft save must not land after (and overwrite) the submit
        await saveFor(idx, inject, {
          answerText: answerEl.value,
          attachments,
          status: "submitted",
        });
        dirtyForCurrent = true;
        submittedForCurrent = true;
        injectLocked = true; // locked unless/until the Facilitator explicitly unlocks this inject
        answerEl.disabled = true;
        fileInput.disabled = true;
        saveStatusEl.textContent = "";
        document.querySelector(".row-buttons").insertAdjacentHTML(
          "beforebegin",
          `<div class="submitted-banner">${submittedText}</div>`
        );
        submitBtn.remove();
        startInjectTimer(null, null);
      } catch (err) {
        errorBoxEl.textContent = err.message;
        errorBoxEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit answer";
      }
    });

    if (forceUnlocked) {
      if (initial.submitted || initial.locked) {
        saveStatusEl.textContent =
          `Unlocked by the facilitator — previously ${initial.submitted ? "submitted" : "timed out"}; you can edit and resubmit.`;
      }
    } else if (initial.submitted) {
      answerEl.disabled = true;
      fileInput.disabled = true;
      document.querySelector(".row-buttons").insertAdjacentHTML(
        "beforebegin",
        `<div class="submitted-banner">${submittedText}</div>`
      );
      submitBtn.remove();
    } else if (initial.locked) {
      answerEl.disabled = true;
      fileInput.disabled = true;
      submitBtn.disabled = true;
      submitBtn.textContent = "Time's up";
      saveStatusEl.textContent = dirtyForCurrent
        ? "Time's up for this inject — your response has been saved automatically."
        : "Time's up for this inject.";
    }

    renderAttachmentList();
  }

  function renderAttachmentList() {
    const listEl = document.getElementById("attachmentList");
    if (!listEl) return;
    listEl.innerHTML = attachments
      .map(
        (a, i) => `<li><span>${escapeHtml(a.filename)}</span><button data-i="${i}">Remove</button></li>`
      )
      .join("");
    listEl.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (injectLocked) return;
        attachments.splice(Number(btn.dataset.i), 1);
        dirtyForCurrent = true;
        renderAttachmentList();
        autosaveDraft(formIdx, formInject, currentAnswerEl, currentSaveStatusEl);
      });
    });
  }

  async function autosaveDraft(idx, inject, answerEl, saveStatusEl) {
    if (submittedForCurrent || injectLocked) return;
    if (idx !== formIdx) return; // the inject changed while this save was waiting — the change handler already saved it
    try {
      await saveFor(idx, inject, {
        answerText: answerEl.value,
        attachments,
        status: reopenedSubmitted ? "submitted" : "draft",
      });
      if (saveStatusEl) saveStatusEl.textContent = "Saved.";
    } catch (err) {
      if (saveStatusEl) saveStatusEl.textContent = `Couldn't save: ${err.message}`;
    }
  }

  // Locks the on-screen form — normally when this inject's time runs out,
  // or (force) when the Facilitator re-locks it. Whatever this device wrote
  // is autosaved one last time (unless already explicitly submitted, or
  // nothing was written on this device — see dirtyForCurrent).
  function lockForCurrentInject(force, message) {
    if (!force && (injectLocked || submittedForCurrent)) return;
    injectLocked = true;
    clearTimeout(saveTimer);
    if (currentAnswerEl) {
      if (!submittedForCurrent && dirtyForCurrent) {
        saveFor(formIdx, formInject, {
          answerText: currentAnswerEl.value,
          attachments,
          status: reopenedSubmitted ? "submitted" : "autosaved",
        }).catch((err) => console.warn("Autosave on lock failed:", err.message));
      }
      currentAnswerEl.disabled = true;
    }
    if (currentFileInput) currentFileInput.disabled = true;
    if (currentSubmitBtn) {
      currentSubmitBtn.disabled = true;
      currentSubmitBtn.textContent = force ? "Locked" : "Time's up";
    }
    if (currentSaveStatusEl) {
      currentSaveStatusEl.textContent = message || (dirtyForCurrent
        ? "Time's up for this inject — your response has been saved automatically."
        : "Time's up for this inject.");
    }
  }

  // Reverses a lock by re-rendering the form as editable, keeping whatever
  // was last on screen.
  function unlockForCurrentInject(message, wasSubmitted, wasLocked) {
    if (!formInject) return;
    injectLocked = false;
    const preservedAnswer = currentAnswerEl ? currentAnswerEl.value : "";
    renderForm(formInject, formIdx, {
      answerText: preservedAnswer,
      submitted: !!wasSubmitted,
      locked: !!wasLocked,
    });
    if (currentSaveStatusEl) {
      currentSaveStatusEl.textContent = message || "The facilitator added more time — you can continue.";
    }
  }

  // deadlineMs: when time runs out (ms timestamp), or null for no deadline
  // (no duration set, already submitted, or unlocked by the facilitator).
  function startInjectTimer(deadlineMs, onExpire) {
    clearInjectTimer();
    let expired = false;
    function tick() {
      const el = document.getElementById("injectTimerValue");
      if (!deadlineMs) {
        if (el) {
          el.textContent = forceUnlocked ? "open (unlocked by facilitator)" : submittedForCurrent ? "submitted" : injectLocked ? "closed" : "no time limit";
          el.classList.remove("warn");
        }
        return;
      }
      const remainingMs = deadlineMs - Date.now();
      if (el) {
        const shown = Math.max(0, remainingMs);
        const m = Math.floor(shown / 60000);
        const s = Math.floor((shown % 60000) / 1000);
        el.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        el.classList.toggle("warn", remainingMs < 60000);
      }
      if (!expired && remainingMs <= 0) {
        expired = true;
        clearInjectTimer();
        if (onExpire) onExpire();
      }
    }
    tick();
    if (deadlineMs) injectTimerInterval = setInterval(tick, 1000);
  }

  function clearInjectTimer() {
    if (injectTimerInterval) clearInterval(injectTimerInterval);
    injectTimerInterval = null;
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);
  }
</script>
</body>
</html>
