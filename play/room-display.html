<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlanProof — Exercise Room Display (prototype)</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --pp-navy: #0b1f3a;
    --pp-amber: #e8a33d;
    --pp-paper: #f4f1ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--pp-navy);
    color: var(--pp-paper);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
    border-bottom: 1px solid rgba(244,241,234,0.15);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: 0.02em; }
  .brand .powered { opacity: 0.6; font-size: 0.85rem; font-weight: 400; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    gap: 24px;
  }
  .timer-row { display: flex; gap: 40px; font-size: 1.1rem; opacity: 0.85; }
  .timer-row .label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; display: block; }
  .timer-row .value { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .timer-row .value.warn { color: var(--pp-amber); }
  .video-card {
    width: min(720px, 90vw);
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #1a3358, #0b1f3a);
    border: 2px solid var(--pp-amber);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    animation: pulse 2.5s ease-in-out infinite;
  }
  .video-card .tag { color: var(--pp-amber); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .video-card .title { font-size: 1.4rem; font-weight: 600; padding: 0 24px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(232,163,61,0.0); } 50% { box-shadow: 0 0 40px 4px rgba(232,163,61,0.25); } }
  .inject-title { font-size: 2.2rem; font-weight: 700; max-width: 900px; }
  .inject-desc { font-size: 1.3rem; max-width: 760px; opacity: 0.9; }
  .lobby { font-size: 1.5rem; opacity: 0.85; }
  .ended { font-size: 1.8rem; font-weight: 600; }
  footer { text-align: center; padding: 14px; font-size: 0.85rem; opacity: 0.5; }
  .sound-gate {
    position: fixed; inset: 0; background: var(--pp-navy); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; z-index: 10;
  }
  .sound-gate button {
    font-size: 1.3rem; padding: 16px 32px; border-radius: 10px; border: none;
    background: var(--pp-amber); color: var(--pp-navy); font-weight: 700; cursor: pointer;
  }
  /* Shows what the last sound attempt actually did (playing / blocked / no
     file) right on screen, so a sound problem can be diagnosed on the room's
     own laptop without opening dev tools. */
  #sfxStatus {
    position: fixed; left: 12px; bottom: 12px; font-size: 0.8rem; font-family: monospace;
    opacity: 0.55; z-index: 5;
  }
  /* Facilitator broadcast (added 5 October 2026). A strip between the header
     and the inject — in the page flow, never on top of the inject — that
     hides itself after BANNER_SECONDS, or as soon as the inject changes.
     The bar along the bottom shows how long it has left. */
  .broadcast-banner {
    display: none; position: relative; overflow: hidden;
    background: var(--pp-amber); color: var(--pp-navy);
    padding: 14px 32px 18px; text-align: center;
  }
  .broadcast-banner.show { display: block; }
  .broadcast-banner .label {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; opacity: 0.75;
  }
  .broadcast-banner .text { font-size: 1.8rem; font-weight: 700; margin-top: 4px; overflow-wrap: anywhere; }
  .broadcast-banner .timebar {
    position: absolute; left: 0; bottom: 0; height: 5px; width: 100%;
    background: rgba(11,31,58,0.45); transform-origin: left center;
  }
  @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
</style>
</head>
<body>

<div class="sound-gate" id="soundGate">
  <div style="font-size:1.1rem; opacity:0.8;">Exercise Room Display</div>
  <button id="startBtn">Tap to begin (enables sound)</button>
</div>

<header>
  <div class="brand">
    <span id="clientLabel">PlanProof</span>
  </div>
  <div class="brand powered">Powered by PlanProof</div>
</header>

<div class="broadcast-banner" id="broadcastBanner" role="status" aria-live="polite">
  <div class="label">Message from the facilitator</div>
  <div class="text" id="broadcastText"></div>
  <div class="timebar" id="broadcastTimebar"></div>
</div>

<main id="main">
  <div class="lobby">Waiting for the facilitator to start the exercise…</div>
</main>

<footer>Exercise room display — prototype (placeholder sound effects &amp; video cards)</footer>
<div id="sfxStatus">sound: —</div>

<!-- Pinned and served from plan-proof.com (system review, 9 October 2026): a CDN outage or a silent library update can no longer break the player. -->
<script src="/vendor/supabase-js-2.117.2.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"></script>
<script src="./shared.js"></script>
<script>
  const sessionId = getSessionId();
  const mainEl = document.getElementById("main");
  const clientLabelEl = document.getElementById("clientLabel");
  const sfxStatusEl = document.getElementById("sfxStatus");
  let lastRenderedIndex = null;
  let injectTimerInterval = null;
  // Audio can only play after a user gesture. If this page loads (or
  // reloads) while an inject is already showing — not starting fresh from
  // the lobby — render() runs immediately, before "Tap to begin" has been
  // clicked, and its playSfx() call gets silently blocked by the browser.
  // Nothing used to retry it: the sound for whatever inject was already
  // live when the page loaded was just lost. audioUnlocked / pendingSfx
  // track that case so the sound plays (or catches up) the moment the gate
  // is actually dismissed, instead of only on the next inject change.
  let audioUnlocked = false;
  let pendingSfx = null;

  setSfxStatusHandler((msg) => {
    sfxStatusEl.textContent = `sound: ${msg}`;
  });

  if (!sessionId) {
    mainEl.innerHTML = `<div class="lobby">No ?session=&lt;id&gt; given in the URL.</div>`;
  } else {
    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("soundGate").style.display = "none";
      // Same gesture unlocks the broadcast chime (Web Audio).
      unlockChime();
      // This click is the user gesture that unlocks audio playback for the
      // rest of the session in most browsers. Priming one real clip here
      // (played muted, immediately stopped) also satisfies stricter browsers
      // (Safari) that need an actual play() call inside the gesture itself.
      const unlock = new Audio(SFX_FILES["siren-ambulance"]);
      unlock.volume = 0;
      unlock
        .play()
        .then(() => {
          unlock.pause();
          audioUnlocked = true;
          sfxStatusEl.textContent = "sound: unlocked ✓";
          // Catch up on the sound for whatever inject was already showing
          // before this tap, since its own playSfx() attempt (at page load)
          // would have been blocked.
          if (pendingSfx) {
            const toPlay = pendingSfx;
            pendingSfx = null;
            playSfx(toPlay);
          }
        })
        .catch((err) => {
          sfxStatusEl.textContent = `sound: unlock failed — ${err.message}`;
        });
    });

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // Live updates plus the safety net (shared.js keepSessionInSync): a
    // silently dropped live connection is noticed and the screen refetches
    // within seconds, with a status pill in the corner.
    const sync = keepSessionInSync({
      sessionId,
      onRow: render,
      // After a drop or a WiFi change, don't trust that the live stream
      // caught everything — re-check for a broadcast missed meanwhile.
      onRecovered: (row) => catchUpBroadcast(row),
    });

    fetchSession(sessionId)
      .then((row) => {
        sync.deliver(row);
        return catchUpBroadcast(row);
      })
      .catch((err) => {
        mainEl.innerHTML = `<div class="lobby">Couldn't load session: ${err.message}</div>`;
      });

    subscribeToSession(supabaseClient, sessionId, sync.deliver, sync.channelStatus("session"));
    subscribeToMessages(supabaseClient, sessionId, (m) => {
      // A live message: full display time, plus the chime if sound is on.
      if (showBroadcast(m, BANNER_SECONDS * 1000) && audioUnlocked) playChime();
    }, sync.channelStatus("messages"));
  }

  // ---- Facilitator broadcast banner (added 5 October 2026) ----------------
  // Shown for BANNER_SECONDS, then hidden, so it never stays in the way of
  // the inject. Also hidden straight away when the inject changes.
  // Room screens only show messages for everyone (department null);
  // department messages (roadmap item 4) go to that department's phones.
  const BANNER_SECONDS = 30;
  const bannerEl = document.getElementById("broadcastBanner");
  const bannerTextEl = document.getElementById("broadcastText");
  const bannerBarEl = document.getElementById("broadcastTimebar");
  let bannerTimer = null;
  let bannerMsg = null;
  let bannerShownId = null;

  function showBroadcast(m, durationMs) {
    if (!m || m.department) return false;
    if (m.id && m.id === bannerShownId && bannerMsg) return false; // already up
    if (durationMs <= 0) return false;
    clearTimeout(bannerTimer);
    bannerMsg = m;
    bannerShownId = m.id || null;
    bannerTextEl.textContent = m.body;
    // Restart the countdown bar's animation from full.
    bannerBarEl.style.animation = "none";
    void bannerBarEl.offsetWidth;
    bannerBarEl.style.animation = `shrink ${durationMs}ms linear forwards`;
    bannerEl.classList.add("show");
    bannerTimer = setTimeout(hideBroadcast, durationMs);
    return true;
  }

  function hideBroadcast() {
    clearTimeout(bannerTimer);
    bannerTimer = null;
    bannerMsg = null;
    bannerEl.classList.remove("show");
  }

  // The inject context a message belongs to: the inject index while
  // running, null before the start.
  function rowContext(row) {
    return row && row.status === "running" ? row.current_inject_index : null;
  }

  // On load or reconnect: if the latest message for everyone was sent for
  // what's showing now and its 30 seconds aren't up, show it for the time
  // it has left (no chime — it isn't new).
  async function catchUpBroadcast(row) {
    if (!row || row.status === "ended") return;
    try {
      const msgs = (await fetchMessages(sessionId)).filter((m) => !m.department);
      const latest = msgs[msgs.length - 1];
      if (!latest) return;
      const msgContext = latest.inject_index === undefined ? null : latest.inject_index;
      if (msgContext !== rowContext(row)) return;
      const ageMs = Math.max(0, Date.now() - new Date(latest.created_at).getTime());
      showBroadcast(latest, BANNER_SECONDS * 1000 - ageMs);
    } catch (err) {
      console.warn("Couldn't load messages:", err.message);
    }
  }

  function render(row) {
    if (!row) return;
    clientLabelEl.textContent = row.label || "PlanProof";

    // A banner belongs to the inject (or the lobby) it was sent during:
    // once the screen has moved on, it goes, even if its 30 seconds aren't up.
    if (bannerMsg) {
      const msgContext = bannerMsg.inject_index === undefined ? null : bannerMsg.inject_index;
      if (row.status === "ended" || msgContext !== rowContext(row)) hideBroadcast();
    }

    if (row.status === "lobby") {
      clearInjectTimer();
      mainEl.innerHTML = `<div class="lobby">Waiting for the facilitator to start the exercise…</div>`;
      lastRenderedIndex = null;
      return;
    }
    if (row.status === "ended") {
      clearInjectTimer();
      mainEl.innerHTML = `<div class="ended">Exercise complete.<br/><span style="opacity:0.7; font-size:1rem;">Thank you for participating.</span></div>`;
      lastRenderedIndex = null;
      return;
    }

    const injects = (row.scenario && row.scenario.injects) || [];
    const idx = row.current_inject_index;
    const inject = injects[idx];
    if (!inject) {
      mainEl.innerHTML = `<div class="lobby">No inject at index ${idx}.</div>`;
      return;
    }

    const isNewInject = idx !== lastRenderedIndex;
    lastRenderedIndex = idx;

    const videoBlock = inject.video
      ? `<div class="video-card"><div class="tag">Now playing</div><div class="title">${escapeHtml(inject.video.title)}</div></div>`
      : "";

    mainEl.innerHTML = `
      ${videoBlock}
      <div class="inject-title">${escapeHtml(inject.title)}</div>
      <div class="inject-desc">${escapeHtml(inject.desc)}</div>
      <div class="timer-row">
        <div>
          <span class="label">This inject</span>
          <span class="value" id="injectTimerValue">--:--</span>
          <span class="label" id="injectTimerNote" style="margin-top:4px;"></span>
        </div>
      </div>
    `;

    if (isNewInject && inject.sfx) {
      if (audioUnlocked) {
        playSfx(inject.sfx);
      } else {
        // Don't attempt a doomed play() before the gate is tapped — queue
        // it so the unlock handler above can play it the moment it can.
        pendingSfx = inject.sfx;
        sfxStatusEl.textContent = `sound: ⏸ waiting for "Tap to begin" to play ${inject.sfx}`;
      }
    }

    // Same deadline as the participants' phones and the database's on-time
    // check: the server's start time for this inject + its duration + any
    // "+5 min". Recalculated on every update (not only when the inject
    // changes), so a reload mid-inject resumes at the real time left and an
    // extension shows straight away. (Fixed 6 October 2026 — the room screen
    // used to start its own stopwatch when it first showed the inject.)
    startInjectTimer(injectDeadlineMs(row, inject), row.inject_extra_minutes || 0);
  }

  function startInjectTimer(deadlineMs, extraMinutes) {
    clearInjectTimer();
    const noteEl = document.getElementById("injectTimerNote");
    if (noteEl) noteEl.textContent = extraMinutes > 0 ? `includes +${extraMinutes} min extra time` : "";
    function tick() {
      const el = document.getElementById("injectTimerValue");
      if (!el) return;
      if (!deadlineMs) {
        el.textContent = "No time limit";
        el.classList.remove("warn");
        return;
      }
      const remainingMs = deadlineMs - Date.now();
      if (remainingMs <= 0) {
        // Phones lock at this point; the room screen says so rather than
        // counting into negative time.
        el.textContent = "Time's up";
        el.classList.add("warn");
        return;
      }
      const m = Math.floor(remainingMs / 60000);
      const s = Math.floor((remainingMs % 60000) / 1000);
      el.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      // Amber in the last minute, as on the phones.
      el.classList.toggle("warn", remainingMs < 60000);
    }
    tick();
    if (deadlineMs) injectTimerInterval = setInterval(tick, 1000);
  }

  function clearInjectTimer() {
    if (injectTimerInterval) clearInterval(injectTimerInterval);
    injectTimerInterval = null;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }
</script>
</body>
</html>
