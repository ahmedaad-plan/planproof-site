<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlanProof — Exercise Room Display (prototype)</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --pp-navy: #0b1f3a;
    --pp-amber: #e8a33d;
    --pp-paper: #f4f1ea;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--pp-navy);
    color: var(--pp-paper);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
    border-bottom: 1px solid rgba(244,241,234,0.15);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: 0.02em; }
  .brand .powered { opacity: 0.6; font-size: 0.85rem; font-weight: 400; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    gap: 24px;
  }
  .timer-row { display: flex; gap: 40px; font-size: 1.1rem; opacity: 0.85; }
  .timer-row .label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; display: block; }
  .timer-row .value { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .timer-row .value.warn { color: var(--pp-amber); }
  .video-card {
    width: min(720px, 90vw);
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #1a3358, #0b1f3a);
    border: 2px solid var(--pp-amber);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    animation: pulse 2.5s ease-in-out infinite;
  }
  .video-card .tag { color: var(--pp-amber); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .video-card .title { font-size: 1.4rem; font-weight: 600; padding: 0 24px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(232,163,61,0.0); } 50% { box-shadow: 0 0 40px 4px rgba(232,163,61,0.25); } }
  .inject-title { font-size: 2.2rem; font-weight: 700; max-width: 900px; }
  .inject-desc { font-size: 1.3rem; max-width: 760px; opacity: 0.9; }
  .lobby { font-size: 1.5rem; opacity: 0.85; }
  .ended { font-size: 1.8rem; font-weight: 600; }
  footer { text-align: center; padding: 14px; font-size: 0.85rem; opacity: 0.5; }
  .sound-gate {
    position: fixed; inset: 0; background: var(--pp-navy); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; z-index: 10;
  }
  .sound-gate button {
    font-size: 1.3rem; padding: 16px 32px; border-radius: 10px; border: none;
    background: var(--pp-amber); color: var(--pp-navy); font-weight: 700; cursor: pointer;
  }
  .sound-gate button:disabled { opacity: 0.45; cursor: not-allowed; }
  /* Item 6 (11 October 2026): with more than one room, the screen asks once
     which room it is in, so the control tower can say which room's screen
     is down or behind. */
  .room-pick { text-align: center; }
  .room-pick .q { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; }
  .room-pick .room-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .sound-gate .room-buttons button {
    font-size: 1.1rem; padding: 12px 20px; background: transparent; color: var(--pp-paper);
    border: 2px solid rgba(244,241,234,0.5); font-weight: 600;
  }
  .sound-gate .room-buttons button.sel { background: var(--pp-paper); color: var(--pp-navy); border-color: var(--pp-paper); }
  .screen-room { margin-left: 10px; font-size: 0.9rem; opacity: 0.85; }
  .screen-room button {
    margin-left: 6px; font-size: 0.8rem; padding: 2px 8px; border-radius: 6px; cursor: pointer;
    background: transparent; color: inherit; border: 1px solid rgba(244,241,234,0.4);
  }
  /* Shows what the last sound attempt actually did (playing / blocked / no
     file) right on screen, so a sound problem can be diagnosed on the room's
     own laptop without opening dev tools. */
  #sfxStatus {
    position: fixed; left: 12px; bottom: 12px; font-size: 0.8rem; font-family: monospace;
    opacity: 0.55; z-index: 5;
  }
  /* Facilitator broadcast (added 5 October 2026). A strip between the header
     and the inject — in the page flow, never on top of the inject — that
     hides itself after BANNER_SECONDS, or as soon as the inject changes.
     The bar along the bottom shows how long it has left. */
  .broadcast-banner {
    display: none; position: relative; overflow: hidden;
    background: var(--pp-amber); color: var(--pp-navy);
    padding: 14px 32px 18px; text-align: center;
  }
  .broadcast-banner.show { display: block; }
  .broadcast-banner .label {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; opacity: 0.75;
  }
  .broadcast-banner .text { font-size: 1.8rem; font-weight: 700; margin-top: 4px; overflow-wrap: anywhere; }
  .broadcast-banner .timebar {
    position: absolute; left: 0; bottom: 0; height: 5px; width: 100%;
    background: rgba(11,31,58,0.45); transform-origin: left center;
  }
  @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* Observer mode (roadmap item 5, 11 October 2026): the same live view on
     an Observer's phone, sized for a phone, plus the notes area underneath.
     Silent — sound comes from the room's display. */
  body.observer-mode { min-height: 0; }
  body.observer-mode header { padding: 12px 16px; flex-wrap: wrap; gap: 4px; }
  body.observer-mode main { flex: 0 0 auto; padding: 18px 16px 8px; gap: 12px; justify-content: flex-start; }
  body.observer-mode .inject-title { font-size: 1.35rem; }
  body.observer-mode .inject-desc { font-size: 1rem; }
  body.observer-mode .lobby { font-size: 1.05rem; }
  body.observer-mode .ended { font-size: 1.2rem; }
  body.observer-mode .timer-row .value { font-size: 1.3rem; }
  body.observer-mode .video-card { width: 100%; }
  body.observer-mode .video-card .title { font-size: 1rem; }
  body.observer-mode .broadcast-banner { padding: 10px 16px 14px; }
  body.observer-mode .broadcast-banner .text { font-size: 1.15rem; }
  body.observer-mode #sfxStatus { display: none; }
  body.observer-mode footer { display: none; }
  .observer-who { font-size: 0.85rem; opacity: 0.8; }
  .observer-panel { padding: 8px 16px 64px; max-width: 720px; width: 100%; margin: 0 auto; box-sizing: border-box; }
  .observer-panel h2 { font-size: 1.05rem; margin: 18px 0 8px; }
  .observer-panel .mine { background: #fff; color: var(--pp-navy); border-radius: 12px; padding: 6px 16px; }
  .observer-panel .mine .empty { opacity: 0.6; font-size: 0.9rem; padding: 10px 0; }
</style>
</head>
<body>

<div class="sound-gate" id="soundGate">
  <div style="font-size:1.1rem; opacity:0.8;">Exercise Room Display</div>
  <div class="room-pick" id="roomPick" hidden>
    <div class="q">Which room is this screen in?</div>
    <div class="room-buttons" id="roomButtons"></div>
  </div>
  <button id="startBtn">Tap to begin (enables sound)</button>
</div>

<header>
  <div class="brand">
    <span id="clientLabel">PlanProof</span>
    <span class="screen-room" id="screenRoom" hidden></span>
  </div>
  <div class="brand powered">Powered by PlanProof</div>
</header>

<div class="broadcast-banner" id="broadcastBanner" role="status" aria-live="polite">
  <div class="label">Message from the facilitator</div>
  <div class="text" id="broadcastText"></div>
  <div class="timebar" id="broadcastTimebar"></div>
</div>

<main id="main">
  <div class="lobby">Waiting for the facilitator to start the exercise…</div>
</main>

<section class="observer-panel" id="observerPanel" hidden aria-label="Observer notes">
  <h2>Your notes</h2>
  <div id="noteForm"></div>
  <h2>Notes you've logged</h2>
  <div class="mine" id="myNotes"><div class="empty">None yet.</div></div>
</section>

<footer>Exercise room display — prototype (placeholder sound effects &amp; video cards)</footer>
<div id="sfxStatus">sound: —</div>

<!-- Pinned and served from plan-proof.com (system review, 9 October 2026): a CDN outage or a silent library update can no longer break the player. -->
<script src="/vendor/supabase-js-2.117.2.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"></script>
<script src="./shared.js"></script>
<script src="./notes.js"></script>
<script>
  const sessionId = getSessionId();
  // Observer mode: only when the join page sent this device here as an
  // Observer (&observer=1) AND it holds that Observer's registration. A plain
  // room-display link is always the shared room screen, unchanged.
  const observerMode = new URLSearchParams(location.search).get("observer") === "1";
  let observer = null;
  if (observerMode && sessionId) {
    try {
      observer = JSON.parse(localStorage.getItem(`pp_identity_${sessionId}`) || "null");
    } catch {
      observer = null;
    }
    if (!observer || observer.role !== "observer" || !observer.attendeeId) {
      location.replace(`./join.html?session=${encodeURIComponent(sessionId)}`);
      throw new Error("No Observer registration on this device — sent back to the join page.");
    }
    document.body.classList.add("observer-mode");
    document.getElementById("soundGate").style.display = "none";
    document.getElementById("clientLabel").insertAdjacentHTML(
      "afterend",
      `<span class="observer-who" id="observerWho"></span>`
    );
    document.getElementById("observerWho").textContent =
      ` · Observer: ${observer.name} — ${observer.department}${observer.room ? ` — Room ${observer.room}` : ""}`;
    document.getElementById("observerPanel").hidden = false;
  }
  const mainEl = document.getElementById("main");
  const clientLabelEl = document.getElementById("clientLabel");
  const sfxStatusEl = document.getElementById("sfxStatus");
  let lastRenderedIndex = null;
  let injectTimerInterval = null;
  // Audio can only play after a user gesture. If this page loads (or
  // reloads) while an inject is already showing — not starting fresh from
  // the lobby — render() runs immediately, before "Tap to begin" has been
  // clicked, and its playSfx() call gets silently blocked by the browser.
  // Nothing used to retry it: the sound for whatever inject was already
  // live when the page loaded was just lost. audioUnlocked / pendingSfx
  // track that case so the sound plays (or catches up) the moment the gate
  // is actually dismissed, instead of only on the next inject change.
  let audioUnlocked = false;
  let pendingSfx = null;
  let checkins = null;
  const screenId = observerMode || !sessionId ? null : loadScreenIdentity(sessionId);

  setSfxStatusHandler((msg) => {
    sfxStatusEl.textContent = `sound: ${msg}`;
  });

  if (!sessionId) {
    mainEl.innerHTML = `<div class="lobby">No ?session=&lt;id&gt; given in the URL.</div>`;
  } else {
    // ---- Start gate, room question and sound (item 6, 11 October 2026) ---
    // A shared room screen has no registration, so it keeps its own id in
    // this browser, plus (with more than one room) which room it is in.
    const gateEl = document.getElementById("soundGate");
    const startBtnEl = document.getElementById("startBtn");
    const roomPickEl = document.getElementById("roomPick");
    const roomButtonsEl = document.getElementById("roomButtons");
    const screenRoomEl = document.getElementById("screenRoom");
    let gateOpen = !observerMode;
    let roomsKnown = 0; // the session's room_count, once loaded

    function roomNeeded() {
      return !observerMode && roomsKnown > 1 && !(screenId.me.room >= 1 && screenId.me.room <= roomsKnown);
    }
    function drawGate() {
      if (observerMode) return;
      const many = roomsKnown > 1;
      roomPickEl.hidden = !many;
      if (many) {
        roomButtonsEl.innerHTML = Array.from({ length: roomsKnown }, (_, i) => i + 1)
          .map((n) => `<button type="button" data-room="${n}" class="${screenId.me.room === n ? "sel" : ""}">Room ${n}${n === 1 ? " (facilitator's)" : ""}</button>`)
          .join("");
      }
      startBtnEl.disabled = roomNeeded();
      startBtnEl.textContent = audioUnlocked ? "Done" : "Tap to begin (enables sound)";
      gateEl.style.display = gateOpen ? "" : "none";
      screenRoomEl.hidden = !(many && screenId.me.room && !gateOpen);
      if (!screenRoomEl.hidden) {
        screenRoomEl.innerHTML = `· Room ${screenId.me.room} <button type="button" id="changeRoomBtn">change</button>`;
      }
    }
    // Called on every session update: a room count that grew or shrank can
    // make the stored room invalid — then the screen asks again.
    function updateRoomUi(row) {
      if (observerMode || !row) return;
      roomsKnown = row.room_count || 1;
      if (roomsKnown > 1 && screenId.me.room && screenId.me.room > roomsKnown) {
        screenId.me.room = null;
        screenId.store();
      }
      if (roomNeeded()) gateOpen = true;
      drawGate();
    }
    roomButtonsEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-room]");
      if (!btn) return;
      screenId.me.room = Number(btn.dataset.room);
      screenId.store();
      drawGate();
    });
    screenRoomEl.addEventListener("click", (e) => {
      if (!e.target.closest("#changeRoomBtn")) return;
      gateOpen = true;
      drawGate();
    });

    function onSoundUnlocked() {
      audioUnlocked = true;
      sfxStatusEl.textContent = "sound: unlocked ✓";
      // Catch up on the sound for whatever inject was already showing
      // before sound was on, since its own playSfx() attempt was blocked.
      if (pendingSfx) {
        const toPlay = pendingSfx;
        pendingSfx = null;
        playSfx(toPlay);
      }
      drawGate();
      if (checkins) checkins.beat();
    }
    // Plays one real clip for an instant. Inside the "Tap to begin" gesture
    // it is silent (volume 0) and unlocks sound for the rest of the session,
    // including on stricter browsers (Safari). Without a gesture — after a
    // reload — it is barely audible (volume 0.01) so the browser's own
    // answer is truthful: it resolves only if this laptop allows sound for
    // this site without a tap.
    function tryUnlockSound(volume) {
      unlockChime();
      const unlock = new Audio(SFX_FILES["siren-ambulance"]);
      unlock.volume = volume;
      return unlock.play().then(() => {
        unlock.pause();
      });
    }

    startBtnEl.addEventListener("click", () => {
      if (roomNeeded()) return;
      gateOpen = false;
      screenId.me.started = true;
      screenId.store();
      drawGate();
      if (audioUnlocked) {
        if (checkins) checkins.beat();
        return;
      }
      tryUnlockSound(0)
        .then(onSoundUnlocked)
        .catch((err) => {
          sfxStatusEl.textContent = `sound: unlock failed — ${err.message}`;
        });
    });

    // After a reload (for example "Full reload" from the control tower) a
    // screen that was already started tries to start itself: no room
    // question left to answer, and sound only if the browser allows it
    // without a tap. Otherwise "Tap to begin" stays, as before.
    let autoStartTried = false;
    function maybeAutoStart() {
      if (observerMode || autoStartTried || !screenId.me.started || roomNeeded()) return;
      autoStartTried = true;
      tryUnlockSound(0.01)
        .then(() => {
          gateOpen = false;
          onSoundUnlocked();
        })
        .catch(() => {
          /* the browser wants a tap — the gate stays up */
        });
    }

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // Live updates (the doorbell) plus the safety net (shared.js
    // keepSessionInSync): a silently dropped live connection is noticed and
    // the screen refetches within seconds, with a status pill in the corner.
    const sync = keepSessionInSync({
      sessionId,
      supabaseClient,
      onRow: (row) => {
        render(row);
        updateRoomUi(row);
        maybeAutoStart();
        awake.update();
        if (checkins) checkins.beatSoon();
      },
      // After a drop or a WiFi change, don't trust that the live stream
      // caught everything — re-check for a broadcast missed meanwhile.
      onRecovered: (row) => catchUpBroadcast(row, false),
      // A new message for participants: fetch it; chime if it really is new.
      onRing: (kind) => { if (kind === "message") catchUpBroadcast(latestRow, true); },
    });

    // Keep the screen awake: a room screen until the exercise ends; an
    // Observer's phone until their notes hour closes.
    const awake = keepAwake({
      wanted: () => {
        if (!latestRow) return true;
        if (!observerMode) return latestRow.status !== "ended";
        return latestRow.status === "lobby" || notesWindow(latestRow, "observer").open;
      },
      onChange: (st) => setNotice("awakeNotice", st === "off" ? AWAKE_NOTICE : null),
    });

    // Check-ins for the Facilitator's control tower; the reply also tells
    // this screen where the exercise really is, and carries "Refresh this
    // screen" / "Full reload" from the tower.
    checkins = startCheckins({
      sessionId,
      kind: observerMode ? "person" : "room_screen",
      attendeeId: observer ? observer.attendeeId : null,
      deviceId: observerMode ? null : screenId.me.deviceId,
      getState: () => ({
        room: observerMode ? null : screenId.me.room,
        page: observerMode ? "observer" : "room",
        shownStatus: latestRow ? latestRow.status : null,
        shownInject: latestRow && latestRow.status === "running" ? latestRow.current_inject_index : null,
        sound: observerMode ? "na" : audioUnlocked ? "on" : "off",
        awake: awake.state(),
        live: sync.liveState(),
      }),
      onReply: (reply) =>
        handleCheckinReply(reply, {
          sync,
          getRow: () => latestRow,
          onSoft: () => showToast("Refreshed by the facilitator.", 6000),
        }),
      onRefused: observerMode
        ? () => setNotice("regNotice", "You are no longer registered in this exercise. Please join again from the join link.")
        : null,
    });

    try {
      if (sessionStorage.getItem("pp_reloaded_by_facilitator")) {
        sessionStorage.removeItem("pp_reloaded_by_facilitator");
        showToast("Reloaded by the facilitator.", 6000);
      }
    } catch { /* ignore */ }

    if (observerMode) {
      watchAway({
        onBack: async (ms) => {
          await sync.resync("back");
          showToast(awayText(ms, latestRow));
        },
      });
    }

    drawGate();
    fetchSession(sessionId)
      .then((row) => {
        sync.deliver(row);
        return catchUpBroadcast(row, false);
      })
      .catch((err) => {
        mainEl.innerHTML = `<div class="lobby">Couldn't load session: ${err.message}</div>`;
      });
  }

  // ---- Facilitator broadcast banner (added 5 October 2026) ----------------
  // Shown for BANNER_SECONDS, then hidden, so it never stays in the way of
  // the inject. Also hidden straight away when the inject changes.
  // Room screens only show messages for everyone (department null);
  // department messages (roadmap item 4) go to that department's phones.
  const BANNER_SECONDS = 30;
  const bannerEl = document.getElementById("broadcastBanner");
  const bannerTextEl = document.getElementById("broadcastText");
  const bannerBarEl = document.getElementById("broadcastTimebar");
  let bannerTimer = null;
  let bannerMsg = null;
  let bannerShownId = null;

  function showBroadcast(m, durationMs) {
    if (!m || m.department) return false;
    if (m.id && m.id === bannerShownId && bannerMsg) return false; // already up
    if (durationMs <= 0) return false;
    clearTimeout(bannerTimer);
    bannerMsg = m;
    bannerShownId = m.id || null;
    bannerTextEl.textContent = m.body;
    // Restart the countdown bar's animation from full.
    bannerBarEl.style.animation = "none";
    void bannerBarEl.offsetWidth;
    bannerBarEl.style.animation = `shrink ${durationMs}ms linear forwards`;
    bannerEl.classList.add("show");
    bannerTimer = setTimeout(hideBroadcast, durationMs);
    return true;
  }

  function hideBroadcast() {
    clearTimeout(bannerTimer);
    bannerTimer = null;
    bannerMsg = null;
    bannerEl.classList.remove("show");
  }

  // The inject context a message belongs to: the inject index while
  // running, null before the start.
  function rowContext(row) {
    return row && row.status === "running" ? row.current_inject_index : null;
  }

  // On load, reconnect or a doorbell ring: if the latest message for
  // everyone was sent for what's showing now and its 30 seconds aren't up,
  // show it for the time it has left. It chimes only when it arrived by a
  // ring and has not been seen on this screen before.
  const seenBroadcastIds = new Set();
  let broadcastFetching = false;
  let broadcastAgain = false;
  async function catchUpBroadcast(row, fromRing) {
    if (!row || row.status === "ended") return;
    if (broadcastFetching) {
      // A ring that arrives mid-fetch is never dropped: fetch once more after.
      broadcastAgain = broadcastAgain || !!fromRing;
      return;
    }
    broadcastFetching = true;
    try {
      const msgs = (await fetchMessages(sessionId)).filter((m) => !m.department);
      const latest = msgs[msgs.length - 1];
      const firstLoad = seenBroadcastIds.size === 0 && !fromRing;
      const isNew = latest && !seenBroadcastIds.has(latest.id);
      msgs.forEach((m) => seenBroadcastIds.add(m.id));
      if (!latest) return;
      const msgContext = latest.inject_index === undefined ? null : latest.inject_index;
      if (msgContext !== rowContext(latestRow || row)) return;
      const ageMs = Math.max(0, Date.now() - new Date(latest.created_at).getTime());
      const shown = showBroadcast(latest, BANNER_SECONDS * 1000 - ageMs);
      if (shown && isNew && fromRing && !firstLoad && audioUnlocked) playChime();
    } catch (err) {
      console.warn("Couldn't load messages:", err.message);
    } finally {
      broadcastFetching = false;
      if (broadcastAgain) {
        broadcastAgain = false;
        catchUpBroadcast(latestRow, true);
      }
    }
  }

  function render(row) {
    if (!row) return;
    latestRow = row;
    if (observerMode) refreshObserverNotes();
    clientLabelEl.textContent = row.label || "PlanProof";

    // A banner belongs to the inject (or the lobby) it was sent during:
    // once the screen has moved on, it goes, even if its 30 seconds aren't up.
    if (bannerMsg) {
      const msgContext = bannerMsg.inject_index === undefined ? null : bannerMsg.inject_index;
      if (row.status === "ended" || msgContext !== rowContext(row)) hideBroadcast();
    }

    if (row.status === "lobby") {
      clearInjectTimer();
      mainEl.innerHTML = `<div class="lobby">Waiting for the facilitator to start the exercise…</div>`;
      lastRenderedIndex = null;
      return;
    }
    if (row.status === "ended") {
      clearInjectTimer();
      mainEl.innerHTML = `<div class="ended">Exercise complete.<br/><span style="opacity:0.7; font-size:1rem;">Thank you for participating.</span></div>`;
      lastRenderedIndex = null;
      return;
    }

    const injects = (row.scenario && row.scenario.injects) || [];
    const idx = row.current_inject_index;
    const inject = injects[idx];
    if (!inject) {
      mainEl.innerHTML = `<div class="lobby">No inject at index ${idx}.</div>`;
      return;
    }

    const isNewInject = idx !== lastRenderedIndex;
    lastRenderedIndex = idx;

    const videoBlock = inject.video
      ? `<div class="video-card"><div class="tag">Now playing</div><div class="title">${escapeHtml(inject.video.title)}</div></div>`
      : "";

    mainEl.innerHTML = `
      ${videoBlock}
      <div class="inject-title">${escapeHtml(inject.title)}</div>
      <div class="inject-desc">${escapeHtml(inject.desc)}</div>
      <div class="timer-row">
        <div>
          <span class="label">This inject</span>
          <span class="value" id="injectTimerValue">--:--</span>
          <span class="label" id="injectTimerNote" style="margin-top:4px;"></span>
        </div>
      </div>
    `;

    // An Observer's phone stays silent: the room's display plays the sound.
    if (isNewInject && inject.sfx && !observerMode) {
      if (audioUnlocked) {
        playSfx(inject.sfx);
      } else {
        // Don't attempt a doomed play() before the gate is tapped — queue
        // it so the unlock handler above can play it the moment it can.
        pendingSfx = inject.sfx;
        sfxStatusEl.textContent = `sound: ⏸ waiting for "Tap to begin" to play ${inject.sfx}`;
      }
    }

    // Same deadline as the participants' phones and the database's on-time
    // check: the server's start time for this inject + its duration + any
    // "+5 min". Recalculated on every update (not only when the inject
    // changes), so a reload mid-inject resumes at the real time left and an
    // extension shows straight away. (Fixed 6 October 2026 — the room screen
    // used to start its own stopwatch when it first showed the inject.)
    startInjectTimer(injectDeadlineMs(row, inject), row.inject_extra_minutes || 0);
  }

  function startInjectTimer(deadlineMs, extraMinutes) {
    clearInjectTimer();
    const noteEl = document.getElementById("injectTimerNote");
    if (noteEl) noteEl.textContent = extraMinutes > 0 ? `includes +${extraMinutes} min extra time` : "";
    function tick() {
      const el = document.getElementById("injectTimerValue");
      if (!el) return;
      if (!deadlineMs) {
        el.textContent = "No time limit";
        el.classList.remove("warn");
        return;
      }
      const remainingMs = deadlineMs - Date.now();
      if (remainingMs <= 0) {
        // Phones lock at this point; the room screen says so rather than
        // counting into negative time.
        el.textContent = "Time's up";
        el.classList.add("warn");
        return;
      }
      const m = Math.floor(remainingMs / 60000);
      const s = Math.floor((remainingMs % 60000) / 1000);
      el.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      // Amber in the last minute, as on the phones.
      el.classList.toggle("warn", remainingMs < 60000);
    }
    tick();
    if (deadlineMs) injectTimerInterval = setInterval(tick, 1000);
  }

  function clearInjectTimer() {
    if (injectTimerInterval) clearInterval(injectTimerInterval);
    injectTimerInterval = null;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  // ---- Observer notes (roadmap item 5, built 11 October 2026) -------------
  // The form (notes.js) keeps an unfinished note on this phone and keeps the
  // inject the note was started on. The list below it is this Observer's own
  // notes, kept on this phone only — nobody, including this Observer, can
  // read notes back from the server — and cleared from the phone once notes
  // close.
  var latestRow = null;
  let noteForm = null;
  const myNotesKey = observer ? `pp_obsnotes_${sessionId}_${observer.attendeeId}` : null;
  const draftKey = observer ? `pp_obsdraft_${sessionId}_${observer.attendeeId}` : null;
  let withdrawArmed = null; // note id waiting for the second tap

  function loadMyNotes() {
    try {
      const list = JSON.parse(localStorage.getItem(myNotesKey) || "[]");
      return Array.isArray(list) ? list : [];
    } catch {
      return [];
    }
  }
  function storeMyNotes(list) {
    try {
      if (list.length) localStorage.setItem(myNotesKey, JSON.stringify(list));
      else localStorage.removeItem(myNotesKey);
    } catch { /* storage blocked — the list just won't survive a reload */ }
  }
  let myNotes = observer ? loadMyNotes() : [];

  function refreshObserverNotes() {
    if (!observerMode || !latestRow) return;
    if (!noteForm) {
      noteForm = createNoteForm(document.getElementById("noteForm"), {
        role: "observer",
        draftKey,
        getRow: () => latestRow,
        save: (payload) => saveObserverNote(sessionId, payload, { attendeeId: observer.attendeeId }),
        onSaved: (result, payload) => {
          const entry = Object.assign({}, payload, {
            runNumber: result && result.run_number,
            injectIndex: result ? result.inject_index : payload.injectIndex,
            createdAt: result && result.created_at,
            updatedAt: result && result.updated_at,
            withdrawn: false,
          });
          const i = myNotes.findIndex((n) => n.id === entry.id);
          if (i >= 0) myNotes[i] = Object.assign({}, myNotes[i], entry, { createdAt: myNotes[i].createdAt || entry.createdAt });
          else myNotes.push(entry);
          storeMyNotes(myNotes);
          renderMyNotes();
        },
      });
    }
    noteForm.refresh();

    const win = notesWindow(latestRow, "observer");
    // Keep only this run's notes; once notes close after the end, clear the
    // phone (the server copy is what the report uses).
    const before = myNotes.length;
    myNotes = myNotes.filter((n) => !latestRow.run_number || n.runNumber === latestRow.run_number);
    if (!win.open && latestRow.status === "ended") {
      myNotes = [];
      try { localStorage.removeItem(draftKey); } catch { /* ignore */ }
    }
    if (myNotes.length !== before) storeMyNotes(myNotes);
    renderMyNotes();
  }

  function renderMyNotes() {
    const box = document.getElementById("myNotes");
    if (!box || !latestRow) return;
    const win = notesWindow(latestRow, "observer");
    const visible = myNotes.filter((n) => !n.withdrawn).slice().reverse();
    if (!visible.length) {
      box.innerHTML = `<div class="empty">${win.open || latestRow.status === "lobby" ? "None yet." : "Notes are closed — your notes have been sent and cleared from this phone."}</div>`;
      return;
    }
    box.innerHTML = visible
      .map((n) =>
        noteItemHtml(
          {
            id: n.id, run_number: n.runNumber, inject_index: n.injectIndex,
            topic: n.topic, topic_other: n.topicOther, note_type: n.noteType,
            department_scope: n.scope, departments: n.departments, external_party: n.externalParty,
            body: n.body, created_at: n.createdAt, updated_at: n.updatedAt,
          },
          {
            row: latestRow,
            actionsHtml: win.open
              ? `<button type="button" data-act="edit" data-id="${escapeHtml(n.id)}">Edit</button>` +
                `<button type="button" class="danger" data-act="withdraw" data-id="${escapeHtml(n.id)}">${withdrawArmed === n.id ? "Tap again to withdraw" : "Withdraw"}</button>`
              : "",
          }
        )
      )
      .join("");
  }

  if (observerMode) {
    document.getElementById("myNotes").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const note = myNotes.find((n) => n.id === btn.dataset.id);
      if (!note) return;
      if (btn.dataset.act === "edit") {
        withdrawArmed = null;
        noteForm.edit(note);
        renderMyNotes();
        return;
      }
      // Withdraw: two taps, so a slip of the finger can't remove a note.
      if (withdrawArmed !== note.id) {
        withdrawArmed = note.id;
        renderMyNotes();
        setTimeout(() => { if (withdrawArmed === note.id) { withdrawArmed = null; renderMyNotes(); } }, 5000);
        return;
      }
      withdrawArmed = null;
      btn.disabled = true;
      btn.textContent = "Withdrawing…";
      try {
        await withdrawObserverNote(sessionId, note.id, { attendeeId: observer.attendeeId });
        note.withdrawn = true;
        storeMyNotes(myNotes);
        noteForm.cancelEditIf(note.id);
      } catch (err) {
        alertNote(err.message);
      }
      renderMyNotes();
    });
    // The window closes on the clock, not only on an update from the server.
    setInterval(refreshObserverNotes, 15000);
  }

  function alertNote(msg) {
    const box = document.getElementById("myNotes");
    box.insertAdjacentHTML("afterbegin", `<div class="empty" style="color:#b00020;opacity:1;">${escapeHtml(msg)}</div>`);
  }
</script>
</body>
</html>
