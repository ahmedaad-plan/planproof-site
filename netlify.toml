[functions]
  directory = "netlify/functions"

[build.environment]
  # play/shared.js embeds the Supabase anon key for client-side use — that's
  # expected and safe (it's the same public key already used by the form
  # function; Row Level Security controls what it can do, not secrecy of the
  # key). Without this, Netlify's secret scanner fails the build thinking
  # it's a leaked credential.
  SECRETS_SCAN_OMIT_PATHS = "play/shared.js"
