<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>PlanProof · Admin</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Installable as a phone app ("Add to Home Screen"); the service worker caches nothing -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PlanProof">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* PlanProof admin — redesigned 21 October 2026 (Ahmed): the exercise
     player's control-tower principles. One dark theme (black page, white
     text; red for warnings, edges and actions; green for done; amber only for
     "keep an eye on it"; no yellow), a command bar that never moves, "At a
     glance" tiles. Since v6 (1 November 2026) a request is a checklist of six
     steps, not a set of tabs; the client record keeps its tabs. One flexible
     layout: under 900px a phone (one column), from 900px a laptop. */
  :root{
    --bg:#0b0f14; --panel:#0b0f14; --panel-2:#0e1319; --field:#070a0e;
    --border:#2b3642; --border-strong:#46566a;
    --text:#e7eaee; --text-muted:#9aa5b1; --accent:#f2f4f7; --accent-ink:#0b0f14;
    --red:#d84a3a; --red-soft:#f0907f; --attn:#e8812f; --green:#4f9c82; --green-soft:#8fd0b8; --focus:#f2f4f7;
    --font-display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --font-body:"IBM Plex Sans",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html{ color-scheme:dark; }
  body{ margin:0; background:var(--bg); color:var(--text); font:15px/1.5 var(--font-body); }
  h1,h2,h3,h4{ font-family:var(--font-display); margin:0; line-height:1.25; }
  h1{ font-size:22px; } h2{ font-size:17px; } h3{ font-size:15px; }
  a{ color:var(--text); }
  button,input,select,textarea{ font:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  [hidden]{ display:none !important; }
  .muted{ color:var(--text-muted); } .small{ font-size:13px; }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .spread{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px 16px; flex-wrap:wrap; }
  .stack > * + *{ margin-top:12px; }
  .end{ justify-content:flex-end; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  bdi{ unicode-bidi:isolate; }

  /* Top bar */
  .bar{ position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--border-strong);
        display:flex; align-items:center; gap:14px; padding:10px 16px; }
  .mark{ font-family:var(--font-display); font-weight:700; font-size:18px; text-decoration:none; white-space:nowrap; }
  .mark span{ color:var(--red); }
  .mark small{ font-family:var(--font-body); font-weight:500; font-size:12px; color:var(--text-muted); margin-left:6px; }
  nav.views{ display:flex; gap:8px; }
  nav.views button{ background:transparent; border:1px solid var(--red); padding:7px 16px; border-radius:8px; color:var(--text); cursor:pointer; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  nav.views button[aria-current="page"]{ background:var(--red); color:#fff; font-weight:700; }
  .count{ display:inline-block; min-width:20px; height:20px; line-height:20px; padding:0 6px; border-radius:10px; background:var(--red); color:#fff; font-size:12px; font-weight:700; text-align:center; }
  nav.views button[aria-current="page"] .count{ background:#fff; color:var(--red); }
  .bar .who{ margin-left:auto; font-size:13px; color:var(--text-muted); display:flex; gap:10px; align-items:center; }
  .bar .ver{ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }
  @media (max-width:899px){ .bar{ padding:8px 10px; gap:8px; } .mark{ font-size:16px; } .mark small{ display:none; } .bar .who{ gap:6px; } .bar .who #whoEmail, .bar .who .ver{ display:none; } nav.views button{ padding:6px 10px; font-size:13px; } .bar .who .btn{ padding:4px 8px; min-height:30px; font-size:12px; } }

  main{ max-width:1100px; margin:0 auto; padding:16px 16px 60px; }

  /* Controls */
  .btn{ border:1px solid var(--border-strong); background:transparent; color:var(--text); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:14px; min-height:40px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
  .btn:hover{ background:rgba(242,244,247,0.06); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; }
  .btn.primary:hover{ background:#fff; }
  .btn.red{ background:var(--red); border-color:var(--red); color:#fff; font-weight:700; }
  .btn.quiet{ border-color:var(--border); font-weight:500; }
  .btn.danger{ color:var(--red-soft); border-color:var(--red); background:transparent; }
  .btn.danger:hover{ background:rgba(216,74,58,0.12); }
  .btn{ white-space:nowrap; }
  .btn.sm{ padding:5px 10px; min-height:32px; font-size:13px; }
  .btn[disabled]{ opacity:.5; cursor:default; }
  input[type=text],input[type=email],input[type=password],input[type=tel],input[type=search],input[type=date],select,textarea{
    background:var(--field); border:1px solid var(--border-strong); border-radius:8px; padding:9px 10px; width:100%; min-height:40px; color:var(--text); }
  textarea{ min-height:76px; resize:vertical; }
  select{ appearance:auto; }
  label.f{ display:block; font-size:13px; color:var(--text-muted); font-weight:500; }
  label.f > input, label.f > select, label.f > textarea{ margin-top:4px; }
  .grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px 14px; }

  /* Cards: one black, thin border, red top edge, red small-capital titles */
  .card{ background:var(--panel); border:1px solid var(--border); border-top:2px solid var(--red); border-radius:12px; padding:14px 16px; }
  .card + .card{ margin-top:14px; }
  .card > h2, .card > .spread > h2{ color:var(--red-soft); font-family:var(--font-body); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; }
  .card.plain{ border-top-color:var(--border); }
  .card.danger-zone{ border-color:var(--red); }
  .cols{ display:grid; gap:14px; align-items:start; }
  @media (min-width:900px){ .cols{ grid-template-columns:1fr 1fr; } .cols > *{ min-width:0; } .cols .card + .card{ margin-top:0; } }

  dl.facts{ display:grid; grid-template-columns:max-content 1fr; gap:4px 16px; margin:0; font-size:14px; }
  dl.facts dt{ color:var(--text-muted); }
  dl.facts dd{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
  @media (min-width:900px){ dl.facts.two{ grid-template-columns:max-content 1fr max-content 1fr; column-gap:24px; } }
  @media (max-width:899px){ dl.facts{ grid-template-columns:1fr; } dl.facts dt{ margin-top:6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; } }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-weight:600; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; padding:6px 8px; border-bottom:1px solid var(--border); }
  td{ padding:8px; border-bottom:1px solid var(--border); vertical-align:top; overflow-wrap:anywhere; }
  tr:last-child td{ border-bottom:0; }
  .table-wrap{ overflow-x:auto; }
  pre{ white-space:pre-wrap; overflow-wrap:anywhere; font:13px/1.5 var(--font-mono); margin:0; }

  /* Pills and tones */
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; border:1px solid var(--border-strong); white-space:nowrap; color:var(--text); }
  .pill::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .pill.ok{ color:var(--green-soft); border-color:var(--green); }
  .pill.wait{ color:var(--attn); border-color:var(--attn); }
  .pill.bad{ color:var(--red-soft); border-color:var(--red); }
  .pill.none{ color:var(--text-muted); }
  .pill.none::before{ background:transparent; border:1px solid currentColor; }
  .tag{ font-size:12px; padding:1px 8px; border-radius:4px; border:1px solid var(--border-strong); color:var(--text-muted); white-space:nowrap; }
  .tag.red{ border-color:var(--red); color:var(--red-soft); }
  .warn{ border:1px solid var(--attn); border-left-width:4px; padding:10px 14px; border-radius:8px; font-size:14px; }
  .alert{ border:1px solid var(--red); border-left-width:4px; padding:10px 14px; border-radius:8px; font-size:14px; }
  .alert h2{ font-size:14px; color:var(--red-soft); margin-bottom:4px; }
  .alert ul{ margin:4px 0 0; padding-left:18px; }
  .sysalert-wrap{ max-width:1100px; margin:12px auto 0; padding:0 16px; }
  .empty{ color:var(--text-muted); padding:10px 0; margin:0; }
  ul.checks{ list-style:none; padding:0; margin:6px 0 0; }
  ul.checks li{ display:flex; gap:10px; align-items:baseline; padding:7px 0; border-top:1px solid var(--border); font-size:14px; flex-wrap:wrap; }
  ul.checks li:first-child{ border-top:0; }
  ul.checks li .pill{ flex:none; }
  ul.checks li span.what{ flex:1 1 220px; min-width:0; overflow-wrap:anywhere; }
  .progress{ font-size:13px; color:var(--attn); margin-top:8px; min-height:1.2em; }
  .rec-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .run-pick{ margin:12px 0 4px; }
  .run-pick label{ display:block; margin-bottom:4px; }
  .run-pick select{ width:100%; max-width:100%; }
  @media (max-width:599px){ .rec-actions .btn{ flex:1 1 100%; } }

  /* At a glance tiles (same as the facilitator page) */
  .kpi-strip{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
  .kpi{ display:flex; flex-direction:column; gap:2px; align-items:flex-start; text-align:left; padding:10px 12px; border:1px solid var(--border); border-top:3px solid var(--border-strong); border-radius:10px; background:transparent; color:var(--text); cursor:default; min-width:0; font:inherit; }
  button.kpi{ cursor:pointer; }
  button.kpi:hover{ border-color:var(--red); }
  .kpi[aria-pressed="true"]{ background:rgba(242,244,247,0.06); border-color:var(--accent); }
  .kpi-v{ font-family:var(--font-mono); font-size:1.6rem; font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums; }
  .kpi-l{ font-size:.74rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; white-space:normal; }
  .kpi[data-tone="ok"]{ border-top-color:var(--green); } .kpi[data-tone="ok"] .kpi-v{ color:var(--green-soft); }
  .kpi[data-tone="wait"]{ border-top-color:var(--attn); } .kpi[data-tone="wait"] .kpi-v{ color:var(--attn); }
  .kpi[data-tone="bad"]{ border-top-color:var(--red); } .kpi[data-tone="bad"] .kpi-v{ color:var(--red-soft); }
  .kpi[data-tone="none"] .kpi-v{ color:var(--text-muted); }
  /* Stage tiles: the colour sits on the top edge and the label; a zero is dim;
     the selected tile fills with its colour. */
  .kpi.stage[data-tone="white"]{ border-top-color:var(--accent); } .kpi.stage[data-tone="white"] .kpi-v{ color:var(--accent); }
  .kpi.stage[data-tone="wait"] .kpi-l{ color:var(--attn); } .kpi.stage[data-tone="ok"] .kpi-l{ color:var(--green-soft); } .kpi.stage[data-tone="white"] .kpi-l{ color:var(--text); } .kpi.stage[data-tone="bad"] .kpi-l{ color:var(--red-soft); }
  .kpi.stage{ border-top-width:4px; }
  .kpi.stage.zero .kpi-v{ color:var(--text-muted); opacity:.6; }
  .kpi.stage[aria-pressed="true"]{ border-color:var(--border-strong); background:rgba(242,244,247,0.08); box-shadow:inset 0 0 0 1px var(--accent); }
  .kpi.stage[aria-pressed="true"][data-tone="wait"]{ background:rgba(232,129,47,0.18); }
  .kpi.stage[aria-pressed="true"][data-tone="ok"]{ background:rgba(79,156,130,0.2); }
  .kpi.stage[aria-pressed="true"][data-tone="bad"]{ background:rgba(216,74,58,0.2); }
  .kpi-strip.seven{ grid-template-columns:repeat(7,minmax(0,1fr)); }
  .kpi-strip.seven .kpi{ padding:8px 10px; }
  .kpi-strip.seven .kpi-v{ font-size:1.4rem; }
  .kpi-strip.seven .kpi-l{ font-size:.68rem; }
  @media (max-width:899px){ .kpi-strip, .kpi-strip.seven{ grid-template-columns:repeat(2,minmax(0,1fr)); } .kpi:last-child:nth-child(odd){ grid-column:1 / -1; } .kpi-v, .kpi-strip.seven .kpi-v{ font-size:1.3rem; } }
  .rno{ font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--text-muted); }
  .lrow.overdue{ border-left:3px solid var(--red); }

  /* Lists of requests and clients: one row each, the whole row opens it */
  .list{ border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .lrow{ display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) auto; gap:4px 14px; align-items:center; padding:12px 14px; border-top:1px solid var(--border); text-decoration:none; color:var(--text); }
  .lrow:first-child{ border-top:0; }
  .lrow:hover{ background:rgba(242,244,247,0.04); }
  .lrow .t{ font-weight:700; font-family:var(--font-display); font-size:16px; overflow-wrap:anywhere; }
  .lrow .s{ font-size:13px; color:var(--text-muted); overflow-wrap:anywhere; }
  .lrow .r{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  @media (max-width:899px){ .lrow{ grid-template-columns:1fr; } .lrow .r{ justify-content:flex-start; } }

  /* Command bar on a request or a client: never moves */
  .cmd{ position:sticky; top:53px; z-index:30; background:var(--bg); border-bottom:1px solid var(--border-strong); margin:-16px -16px 14px; padding:10px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; }
  .cmd .back{ font-size:13px; color:var(--text-muted); text-decoration:none; white-space:nowrap; }
  .cmd .back:hover{ color:var(--text); }
  .cmd .title{ flex:1 1 260px; min-width:0; }
  .cmd .title h1{ overflow-wrap:anywhere; }
  .cmd .title .s{ font-size:13px; color:var(--text-muted); overflow-wrap:anywhere; }
  .cmd .next{ font-size:13px; color:var(--text-muted); flex-basis:100%; }
  .cmd .next b{ color:var(--text); font-weight:600; }
  .cmd .tools{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .cmd select{ width:auto; min-width:190px; }
  @media (max-width:899px){ .cmd{ top:49px; gap:6px 12px; padding:8px 12px; margin:-16px -16px 12px; } .cmd .tools{ flex-basis:100%; } .cmd select{ flex:1 1 auto; } }

  /* Tabs: centred red-edged buttons on a laptop; a bottom bar on a phone */
  .tabs{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:0 0 14px; }
  .tab{ display:inline-flex; align-items:center; gap:6px; padding:9px 20px; border:1px solid var(--red); border-radius:8px; background:transparent; color:var(--text); cursor:pointer; font-size:15px; font-weight:600; }
  .tab:hover{ background:rgba(216,74,58,0.12); }
  .tab[aria-selected="true"]{ background:var(--red); color:#fff; font-weight:700; }
  .tab .count{ background:var(--red); color:#fff; }
  .tab[aria-selected="true"] .count{ background:#fff; color:var(--red); }
  .panel[hidden]{ display:none; }
  @media (max-width:899px){
    .tabs{ position:fixed; inset-inline:0; bottom:0; z-index:40; background:var(--bg); border-top:1px solid var(--border-strong); padding:6px 6px calc(6px + env(safe-area-inset-bottom)); gap:4px; flex-wrap:nowrap; }
    .tab{ flex:1 1 0; min-width:0; justify-content:center; padding:10px 4px; font-size:13px; border-radius:6px; }
    /* Five tabs since W5 (Exercise): label over its count so every word fits a 360 px phone. */
    .tab{ flex-direction:column; gap:2px; padding:6px 2px; font-size:12px; line-height:1.2; }
    .tab .count{ font-size:10px; min-width:16px; line-height:14px; padding:0 4px; }
    .tab span.l{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    body.has-tabs main{ padding-bottom:84px; }
    body.kbd .tabs{ display:none; }
  }

  /* Versions, comments, remarks */
  .item{ padding:10px 0; border-top:1px solid var(--border); }
  .item:first-child{ border-top:0; padding-top:0; }
  .item .body{ white-space:pre-wrap; overflow-wrap:anywhere; margin:4px 0 8px; }
  .item .meta{ font-size:13px; color:var(--text-muted); }
  .item .meta b{ color:var(--red-soft); font-weight:700; }
  .vstat{ width:auto; min-width:170px; }
  .cand{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-top:8px; flex-wrap:wrap; }
  ul.reasons{ margin:6px 0 0; padding-left:18px; font-size:14px; color:var(--text-muted); }
  details > summary{ cursor:pointer; color:var(--text-muted); font-size:14px; }
  details[open] > summary{ margin-bottom:10px; }
  .band{ font-family:var(--font-mono); font-weight:600; }
  .band.green{ color:var(--green-soft); } .band.amber{ color:var(--attn); } .band.red{ color:var(--red-soft); }

  /* v7.0 (W8 build 1): one request, one page — the status strip, then the
     blocks Client · Scenario · Exercise · Report · Clean-up. One red button
     on the page: the strip's NEXT. A block not reached yet is grey. */
  .v7-strip{ border:1px solid var(--border-strong); border-top:3px solid var(--red); border-radius:12px; background:var(--panel); padding:12px 16px; margin:0 0 12px;
    display:grid; grid-template-columns:1fr; gap:10px; }
  .v7-strip.overdue{ border-top-color:var(--red); box-shadow:0 0 0 1px var(--red) inset; }
  .v7-dots{ list-style:none; display:flex; gap:4px 14px; margin:0; padding:0; flex-wrap:wrap; font-size:12px; color:var(--text-muted); }
  .v7-dots li{ display:inline-flex; align-items:center; gap:6px; }
  .v7-dots .dot{ width:16px; height:16px; border-radius:50%; border:1px solid var(--border-strong); display:inline-flex; align-items:center; justify-content:center; font-size:10px; }
  .v7-dots li.done .dot{ background:var(--green); border-color:var(--green); color:#fff; }
  .v7-dots li.now{ color:var(--text); font-weight:600; } .v7-dots li.now .dot{ border-color:var(--red); background:var(--red); }
  .v7-where, .v7-next{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; min-width:0; }
  .v7-where .cap, .v7-next .cap{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); min-width:84px; }
  #whereText{ overflow-wrap:anywhere; min-width:0; flex:1 1 200px; }
  .due-bad{ color:var(--red-soft) !important; font-weight:600; }
  .v7-live{ border:1px solid var(--attn); border-radius:10px; padding:8px 12px; margin:0 0 12px; font-size:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .v7-blocks{ display:flex; flex-direction:column; gap:12px; }
  .v7-block{ border:1px solid var(--border); border-radius:12px; background:var(--panel); padding:14px 16px; min-width:0; }
  .v7-block.grey{ border-style:dashed; background:transparent; padding:10px 16px; }
  .v7-block.grey h2{ color:var(--text-muted); }
  .v7-bhead{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .v7-bhead h2{ font-size:16px; margin:0; flex:1 1 auto; }
  .v7-block.grey .v7-bhead{ margin-bottom:2px; }
  .v7-greyline{ margin:0; }
  .v7-clientline{ display:flex; flex-direction:column; gap:2px; font-size:14px; margin-bottom:8px; }
  .v7-fold{ margin-top:8px; }
  .v7-version .vno{ font-family:var(--font-mono); }
  .v7-summary{ border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-top:8px; }
  .add-box textarea{ font-family:var(--font-mono); font-size:12px; }
  .add-box textarea.drop{ outline:2px dashed var(--attn); }
  .tag.src-page{ border-color:var(--green); color:var(--green-soft); }
  .lrow.overdue .r .pill{ font-weight:700; }
  .kpi-strip.five{ grid-template-columns:repeat(5,minmax(0,1fr)); }
  #copyDlg{ width:min(920px, 96vw); max-height:92vh; padding:0; border:0; border-radius:12px; background:#eef1f5; }
  #copyDlg .copy-bar, #mailDlg .copy-bar{ position:sticky; top:0; display:flex; gap:8px; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--panel); color:var(--text); flex-wrap:wrap; }

function gate(...nodes) { $("gateBody").replaceChildren(...nodes); $("gate").hidden = false; $("app").hidden = true; $("bar").hidden = true; }

function showSignIn(msg) {
  const email = h("input", { type: "email", autocomplete: "username", required: true });
  const pw = h("input", { type: "password", autocomplete: "current-password", required: true });
  const form = h("form", { class: "stack", onsubmit: async (e) => {
    e.preventDefault(); btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pw.value });
    btn.disabled = false;
    if (error) return showSignIn("Sign-in failed: " + error.message);
    afterSignIn();
  } },
    msg ? h("p", { class: "warn" }, msg) : null,
    h("label", { class: "f" }, "Email", email),
    h("label", { class: "f" }, "Password", pw));
  const btn = h("button", { class: "btn primary", type: "submit" }, "Sign in");
  form.append(btn);
  gate(form); email.focus();
}

async function afterSignIn() {
  const { data: aal, error } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (error) return showSignIn(error.message);
  if (aal.currentLevel === "aal2") return enterApp();
  const { data: f } = await sb.auth.mfa.listFactors();
  const totp = (f && f.totp || []).find((x) => x.status === "verified");
  if (totp) return showMfaChallenge(totp.id);
  return showMfaEnrol();
}

function codeForm(factorId, intro) {
  const code = h("input", { type: "text", inputmode: "numeric", autocomplete: "one-time-code", maxlength: "6", pattern: "[0-9]{6}", required: true });
  const btn = h("button", { class: "btn primary", type: "submit" }, "Verify");
  const err = h("p", { class: "warn", hidden: true });
  const form = h("form", { class: "stack", onsubmit: async (e) => {
    e.preventDefault(); btn.disabled = true;
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId, code: code.value.trim() });
    btn.disabled = false;
    if (error) { err.hidden = false; err.textContent = "That code didn't work: " + error.message + ". Use the current 6-digit code."; code.select(); return; }
    enterApp();
  } }, intro, err, h("label", { class: "f" }, "6-digit code from your authenticator app", code), btn);
  setTimeout(() => code.focus(), 0);
  return form;
}

function showMfaChallenge(factorId) {
  gate(codeForm(factorId, h("p", { class: "muted" }, "Enter the code from your authenticator app to open the admin page.")));
}

async function showMfaEnrol() {
  // Clear any half-finished enrolment first, so a retry doesn't hit a duplicate name.
  const { data: f } = await sb.auth.mfa.listFactors();
  for (const x of (f && f.all || [])) if (x.status !== "verified") await sb.auth.mfa.unenroll({ factorId: x.id });
  const { data, error } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "PlanProof admin" });
  if (error) return showSignIn("Couldn't start two-step sign-in setup: " + error.message);
  gate(codeForm(data.id, h("div", { class: "stack" },
    h("p", {}, "Set up two-step sign-in once. Client records are confidential, so the database refuses access without it."),
    h("p", { class: "muted small" }, "Scan this with Microsoft Authenticator, Google Authenticator or 1Password, then enter the code it shows."),
    h("div", { class: "qr" }, h("img", { src: data.totp.qr_code, alt: "Authenticator QR code" })),
    h("p", { class: "muted small" }, "Can't scan? Enter this key: ", h("code", {}, data.totp.secret)))));
}

async function enterApp() {
  const ok = await q(sb.rpc("admin_whoami")).catch(() => false);
  const { data: { user } } = await sb.auth.getUser();

// ================= The six steps (checklist page, v6 — 1 November 2026) =================
// Ahmed, 1 November 2026: "a request is a checklist, not a set of tabs". One
// page per request; six steps top to bottom in the order they happen. The
// seven database stages are shown as six steps and the database is unchanged:
// the open step is computed by ONE function, stepOf(), from the same facts
// the database uses (stage, client match, scenario versions, exercise record).
const OVERDUE_DAYS = 7;
const daysSince = (iso) => Math.floor((Date.now() - Date.parse(iso)) / 86400000);
const isOverdue = (s) => (s.status === "new" || s.status === "contacted") && daysSince(s.created_at) >= OVERDUE_DAYS;
const dDay = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { timeZone: "Asia/Dubai", day: "numeric", month: "short", year: "numeric" }) : "";
const dShort = (s) => s ? new Date(s + (s.length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "Asia/Dubai" }) : "";
const dMonth = (s) => s ? new Date(s + (s.length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-GB", { month: "short", year: "numeric" }) : "";
const plusDays = (iso, n) => new Date(Date.parse(iso) + n * 86400000).toISOString();
const STEP_DONE_TITLE = { 1: "Client confirmed", 2: "Contacted", 3: "Scenario approved", 4: "Exercise", 5: "Report delivered", 6: "Participants' data removed" };
const STEP_TITLE = { 1: "Who is this client?", 2: "Contact the client", 3: "Scenario", 4: "Exercise", 5: "Report delivered", 6: "Participants' data removed" };
const STEP_FUTURE = { 1: "", 2: "", 3: "design it, send it to the sponsor, take their comments, get it approved", 4: "link the exercise, wait for notes and survey, download the record", 5: "pressed from step 4 · starts the 7-day clock", 6: "automatic, 7 days after delivery — nothing for you to do" };
const USED_SENTENCE = { yes: "The form says they have exercised with PlanProof before.", no: "The form says they have not exercised with PlanProof before.", not_sure: "The form says they are not sure whether they have exercised with PlanProof before." };

const liveVersions = (versions) => (versions || []).filter((v) => !v.withdrawn_at);
const newestVersion = (versions) => liveVersions(versions).slice().sort((a, b) => b.version_no - a.version_no)[0] || null;

// The facts of the exercise linked to a request, for the run chosen to
// download (W4b). `session` is one row of admin_exercise_sessions (with
// .runs when loaded); chosenRun is a run number or null (the current run).
function recordFacts(session, chosenRun) {
  if (!session) return { linked: false };
  const r = session.record || {};
  const runs = Array.isArray(session.runs) ? session.runs : null;
  const chosen = runs && chosenRun != null ? runs.find((u) => u.run_number === chosenRun) || null : null;
  const earlier = !!(chosen && !chosen.current);
  const purged = r.state === "purged";
  return {
    linked: true, earlier, purged,
    run: chosen ? chosen.run_number : r.run_number,
    ended: earlier ? !!chosen.exportable : r.state !== "not_ended",
    waiting: !earlier && r.state === "waiting",
    survey_open: !earlier && !!r.survey_open,
    downloaded: earlier ? !!chosen.exported_at : !!(r.exported_at && r.exported_run === r.run_number),
    downloaded_at: earlier ? chosen.exported_at : r.exported_at,
    purge_due_at: r.purge_due_at || null, purged_at: r.purged_at || null,
    // The daily job runs at 06:17 UAE; a day's grace before calling it overdue.
    overdue: !purged && !!r.purge_due_at && Date.now() > Date.parse(r.purge_due_at) + 26 * 3600 * 1000,
  };
}

// stepOf: the ONE place that decides which step is open, its sentence and its
// buttons. Unit-tested for every stage × version state × record state.
//   step 1..6 (5 is never left open: it is pressed from step 4), 7 = all done.
//   buttons: the actions the open step offers, the first one is the main (red) one.
//   due: the few words shown on the Requests list.
function stepOf(request, versions, comments, record) {
  const st = request.status;
  const vs = liveVersions(versions);
  const cs = (comments || []).filter((c) => !c.withdrawn_at);
  const rec = record || { linked: false };
  const lastNo = Math.max(request._lastVersionNo || 0, 0, ...vs.map((v) => v.version_no));
  const approved = vs.filter((v) => v.status === "approved").sort((a, b) => b.version_no - a.version_no)[0] || null;
  const base = (step, extra) => ({ step, title: STEP_TITLE[step] || "All done", buttons: [], ...extra });

  if (request.match_status === "pending") {
    const n = (request.match_candidates || []).length;
    const used = USED_SENTENCE[request.used_before] || "";
    const look = n === 1 ? "One existing client looks similar:" : n > 1 ? n + " existing clients look similar:" : "No existing client looks similar — search your clients if you think it is one of them.";
    return base(1, { sentence: (used ? used + " " : "") + look, buttons: n ? ["new_client", "this_client", "search"] : ["new_client", "search"], due: "confirm who the client is" });
  }
  if (st === "new") return base(2, { sentence: "Call or email the sponsor (the discovery call before the scenario), then press Contacted.", buttons: ["contacted"], due: "contact the client" });

  if (["contacted", "scenario_sent", "client_reviewing"].includes(st) && !approved) {
    const v = newestVersion(vs);
    if (!v) return base(3, { sentence: `Design the scenario with Claude, then record v${lastNo + 1} as sent.`, buttons: ["record"], next: lastNo + 1, due: "design the scenario" });
    if (v.status === "client_commented") {
      const about = cs.filter((c) => c.version_id === v.id);
      const c = (about.length ? about : cs).slice().sort((a, b) => String(b.received_on).localeCompare(String(a.received_on)))[0];
      return base(3, { sentence: `v${v.version_no} was sent on ${dShort(v.sent_on)}. The sponsor commented${c ? " on " + dShort(c.received_on) : ""}.`,
        strong: `Revise it with Claude, then record v${lastNo + 1} as sent — or approve v${v.version_no} if they accepted it as it is.`,
        buttons: ["record", "approve", "comment"], next: lastNo + 1, approve: v.version_no, due: "revise the scenario (client commented)" });
    }
    // Waiting for the sponsor (Ahmed, 1 November 2026): nothing is due, so no
    // button is red, and the sentence says which button fits which answer.
    return base(3, { waiting: true, sentence: `v${v.version_no} was sent on ${dShort(v.sent_on)} — waiting for the sponsor.`,
      strong: `If they accept it as it is, press Approve v${v.version_no}. If they send changes, press + Client comment.`,
      buttons: ["approve", "comment", "record"], next: lastNo + 1, approve: v.version_no, due: "waiting for the sponsor" });
  }

  if (st === "delivered") {
    if (rec.linked && rec.purged) return base(7, { done: true, sentence: "Nothing left to do — participants' data removed" + (rec.purged_at ? " on " + dDay(rec.purged_at) : "") + ".", due: "done" });
    if (!rec.linked) return base(7, { done: true, sentence: "Nothing left to do — no exercise is linked to this request, so there is no participants' data to remove.", due: "done" });
    if (rec.overdue) return base(6, { overdue: true, sentence: `Overdue — it was due on ${dDay(rec.purge_due_at)}, but the daily job has not removed it. Check SUPABASE_SECRET_KEY in Netlify, or use "Remove participants' data now" under More….`, due: "data removal overdue" });
    return base(6, { sentence: rec.purge_due_at ? `Automatic — due on or after ${dDay(rec.purge_due_at)} (7 days after delivery). Nothing for you to do.` : "Automatic, 7 days after delivery. Nothing for you to do.", due: "data removal (automatic)" });
  }

  // Step 4: scenario approved or exercise scheduled (or an approved version
  // while the stage was left behind).
  if (!rec.linked) return base(4, { sentence: "Link the player exercise to this request when you set it up.", buttons: ["link"], due: "link the exercise" });
  if (rec.purged) return base(4, { sentence: "The participants' data has been removed. Once the client has accepted the final report, press Mark as delivered.", buttons: rec.downloaded ? ["delivered"] : [], due: "mark delivered" });
  if (!rec.ended) return base(4, { sentence: "The exercise has not ended yet. Run it; after End, the notes and the survey stay open for a while.", buttons: [], due: "run the exercise" });
  if (rec.downloaded) return base(4, { report: true, sentence: `Run ${rec.run} is downloaded. Write the report from it; once the client has accepted the final report, press Mark as delivered.`, buttons: ["delivered", "download"], due: "deliver the report, then mark delivered" });
  if (rec.waiting) return base(4, { sentence: "Wait for the notes and the survey to close" + (rec.survey_open ? " — or close the survey now — then" : ", then") + " download the record.", buttons: (rec.survey_open ? ["close_survey"] : []).concat(["download"]), due: "notes or survey still open" });
  return base(4, { sentence: `Download run ${rec.run} and give it to the report chat.`, buttons: ["download"], due: "download the record" });
}

// ================= v7.1 (W8 build 1, 13 November 2026): one request, one page — simplified =================
// v7.1 after Pass check 1 (Ahmed, 12–13 Nov): focus mode (only the block in hand is open), tables instead of
// comma lines, one name "Done", a tappable progress line, a "what to do now" line, preview before send,
// a test copy to yourself, the full version for PlanProof, "How it came" on pasted comments, the Requests
// list as a table sorted by what needs you first.
// Design: planproof-reference/w8-design.md Part C. Five tiles (Client · Scenario ·
// Exercise · Report · Done); on a request: the STATUS STRIP (where it is + the one
// red button), the Client header, then four blocks in the order things happen —
// Scenario · Exercise · Report · Clean-up. ONE function, stateOf(), decides the
// strip, the tile and the list pill; it is unit-tested (t_admin2, section V7).
const V7_TILES = [[1, "Contact"], [2, "Scenario"], [3, "Exercise"], [4, "Report"], [5, "Done"]];
const V7_TILE_TONE = { 1: "wait", 2: "wait", 3: "white", 4: "white", 5: "ok" };
const V7_BLOCKS = [["client", "Contact"], ["scenario", "Scenario"], ["exercise", "Exercise"], ["report", "Report"], ["cleanup", "Done"]];
const VERSION_WORD = { draft: "Not sent", sent: "Sent", client_commented: "Client commented", approved: "Approved", superseded: "Superseded" };
const VERSION_TONE_V7 = { draft: "wait", sent: "wait", client_commented: "wait", approved: "ok", superseded: "none" };
const EMAIL_WORD = { sending: "sending…", sent: "sent, not yet delivered", delivered: "delivered", delayed: "delayed", bounced: "BOUNCED", complained: "marked as spam", failed: "NOT SENT", unknown: "status unknown" };
const EMAIL_BAD = new Set(["bounced", "complained", "failed", "unknown"]);
let requestTile = Number(sessionStorage.getItem("pp_admin_reqtile7")) || 0;
let showDelivered = sessionStorage.getItem("pp_admin_showdelivered") === "1";
let requestSearch = "";
let keepScroll = null;
const reloadKeepingPlace = () => { keepScroll = window.scrollY; route(); };

// Dates: Day-5 due date = Contacted + 5 working days (Monday–Friday, UAE time).
const dubaiYmd = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: "Asia/Dubai" });
function workingDaysAfter(iso, n) {
  const d = new Date(dubaiYmd(iso) + "T12:00:00Z");
  let left = n;
  while (left > 0) { d.setUTCDate(d.getUTCDate() + 1); const wd = d.getUTCDay(); if (wd !== 0 && wd !== 6) left--; }
  return d.toISOString().slice(0, 10);
}
const dayName = (ymd) => ymd ? new Date(ymd + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }) : "";
const pastDue = (ymd, nowMs = Date.now()) => !!ymd && dubaiYmd(new Date(nowMs).toISOString()) > ymd;
const contactedAt = (remarks) => ((remarks || []).filter((r) => /^Contact note:/i.test(r.body) && !r.withdrawn_at)
  .sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)))[0] || {}).created_at || null;
const hm = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { timeZone: "Asia/Dubai", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

// stateOf: where the request is and the ONE next action.
//   x: { contactedAt, links, emails, opens, nowMs } (links/emails/opens may be empty on the list)
//   returns { block, tile, where, next:{key,label}|null, waiting, due, overdue, pill:{text,tone} }
function stateOf(s, versions, comments, rec, x = {}) {
  const nowMs = x.nowMs ?? Date.now();
  const vs = liveVersions(versions);
  const cs = (comments || []).filter((c) => !c.withdrawn_at);
  const newest = newestVersion(vs);
  const approved = vs.filter((v) => v.status === "approved").sort((a, b) => b.version_no - a.version_no)[0] || null;
  const lastNo = Math.max(s._lastVersionNo || 0, 0, ...vs.map((v) => v.version_no));
  const due = x.contactedAt ? workingDaysAfter(x.contactedAt, 5) : null;
  const firstSent = vs.some((v) => v.status !== "draft");
  const overdue = !!due && !firstSent && pastDue(due, nowMs) && s.status !== "delivered";
  const R = (o) => {
    const pillText = o.next ? o.next.label + (o.showDue && due ? " — due " + dayName(due) : "") : o.waitText || "Waiting";
    // red: the Day-5 date passed with no version sent, or the data removal is overdue
    const ov = o.overdue != null ? !!o.overdue : (o.block === "scenario" || o.block === "client") ? overdue : false;
    return { due, firstSent, waiting: !o.next, ...o, overdue: ov,
      pill: { text: pillText, tone: ov ? "bad" : o.tile === 5 ? "ok" : o.tile >= 3 ? "white" : "wait" } };
  };
  if (s.match_status === "pending") return R({ block: "client", tile: 1, where: "New request" + (s.source === "website" ? " from the website" : ""), next: { key: "confirm_client", label: "Confirm the client" }, hint: "Check whether this organisation is already one of your clients, then confirm it." });
  if (s.status === "new") return R({ block: "client", tile: 1, where: "Client confirmed", next: { key: "contacted", label: "Contacted" }, hint: "Call the sponsor (the discovery call), then press Contacted. Scenario v1 is due 5 working days later." });
  if (s.status === "delivered") {
    const o = stepOf(s, versions, comments, rec);
    return R({ block: "cleanup", tile: 5, where: o.step >= 7 ? "Done — " + o.sentence.replace(/^Nothing left to do — /, "") : "Delivered · " + o.sentence, next: null, waitText: o.overdue ? "Data removal overdue" : "Done", overdue: !!o.overdue });
  }
  // A version newer than the approved one (e.g. v3 after v2 was approved) is the live question.
  const open = newest && newest.status !== "approved" && newest.version_no > (approved ? approved.version_no : 0) ? newest : null;
  if (!open && approved) {
    if (!rec || !rec.linked) return R({ block: "exercise", tile: 3, where: `v${approved.version_no} approved${approved.status_changed_on ? " on " + dShort(approved.status_changed_on) : ""}`, next: { key: "setup", label: `Approve v${approved.version_no} → set up the exercise` }, hint: `Ask Claude to set up the exercise from v${approved.version_no}, then choose it in the Exercise block. (The next build does this from the page.)` });
    const o = stepOf(s, versions, comments, rec);
    const b = (o.buttons || [])[0];
    const label = b === "download" ? `Download run ${rec.run}` : b === "delivered" ? "Mark as delivered" : b === "close_survey" ? "Close survey now" : b === "link" ? "Link the exercise" : null;
    const tile = o.report || (rec.downloaded && !rec.purged) ? 4 : 3;
    return R({ block: tile === 4 ? "report" : "exercise", tile, where: o.sentence, next: label ? { key: "ex_" + b, label } : null, waitText: o.due ? o.due.replace(/^./, (c) => c.toUpperCase()) : "Waiting" });
  }
  // Scenario

  if (v.status === "draft") return R({ block: "scenario", tile: 2, where: `v${v.version_no} added${v.added_how === "claude" ? " by Claude" : ""} ${hm(v.created_at)} — not sent yet`, next: { key: "send", label: `Send v${v.version_no} to the sponsor` }, showDue: true, hint: `Press "Preview what the sponsor will see", then "Send v${v.version_no} to the sponsor".` });

  return R({ block: "scenario", tile: 2, where: `v${v.version_no} sent ${v.sent_on ? dShort(v.sent_on) : ""}${link ? "" : " (recorded by hand)"}${opened} — waiting for the sponsor`, next: null, waitText: "Waiting for the sponsor", hint: "Nothing to do. The sponsor's comments or approval appear here by themselves." });
}

function requestTable(shown) {

async function liveSig(id) {

    q(sb.from("submission_scenario_versions").select("id, updated_at").eq("submission_id", id)).catch(() => []),
    q(sb.from("submission_client_comments").select("id, updated_at").eq("submission_id", id)).catch(() => []),

function startLive(id, knownVersionIds) {
  stopLive();
  live.id = id;
  const filt = "submission_id=eq." + id;
  try {
    live.channel = sb.channel("req-" + id)
      .on("postgres_changes", { event: "*", schema: "public", table: "submission_scenario_versions", filter: filt }, (p) => {
        const n = p.new || {};
        const fresh = n.id && !knownVersionIds.has(n.id);

      .on("postgres_changes", { event: "INSERT", schema: "public", table: "client_link_opens", filter: filt }, (p) => onActivity(p.new && p.new.outcome !== "ok" ? "The sponsor tried an expired or revoked link" : ""))
      .on("postgres_changes", { event: "*", schema: "public", table: "sent_emails", filter: filt }, () => onActivity(""))
      .subscribe();
  } catch (err) { console.warn("live channel", err); }
  liveSig(id).then((s) => { if (live.id === id) live.sig = s; });
  live.timer = setInterval(async () => {
    if (document.hidden || live.id !== id) return;
    const s = await liveSig(id).catch(() => null);
    if (s && live.sig && s !== live.sig) { live.sig = s; onActivity(""); }

// The content of a step. readOnly: a done or future step opened by a tap —
// facts only, no buttons. btns/forms: where the open step puts its buttons
// (at the top of the card, so they are never off-screen on a phone).
function stepBody(n, ctx, readOnly, btns, forms) {
  if (n === 1) return step1Body(ctx, readOnly, btns, forms);

// ---- Step 4: the exercise and its record (W5, W5b, W4b) ----
// One exercise (player session) per request. When it has ended and its notes
// and survey have closed, PlanProof downloads ONE zip: the text the report
// skill reads, the exact record, the participants' attachments and a
// manifest of fingerprints. Nothing downloads unless every part is there and
// reopens correctly. Mark as delivered starts the 7-day clock for removing the
// participants' data (never before an export).
const RECORD_BUCKET = "submission-attachments";

  return Array.from(new Uint8Array(d), (b) => b.toString(16).padStart(2, "0")).join("");
}

  const url = URL.createObjectURL(new Blob([bytes], { type }));

  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function buildRecordZip(sessionId, say, run) {
  if (!window.PPRecord || !window.fflate) throw new Error("The export tools did not load. Reload the page and try again.");
  say("Reading the exercise record…");
  // W4b (31 October 2026): the record of the run chosen (any run can be
  // downloaded until the participants' data is removed).
  const rec = await q(sb.rpc("admin_export_record", run ? { p_session: sessionId, p_run: run } : { p_session: sessionId }));
  if (!rec || rec.format !== PPRecord.FORMAT) throw new Error("The database returned an unexpected record. Nothing was saved.");
  const enc = new TextEncoder();
  const exportedAt = new Date().toISOString();
  const files = [];
  const att = PPRecord.attachmentEntries(rec), missing = [];
  for (let i = 0; i < att.length; i++) {
    say(`Downloading attachment ${i + 1} of ${att.length}…`);
    const { data, error } = await sb.storage.from(RECORD_BUCKET).download(att[i].path);
    if (error || !data) { missing.push(att[i].zipName); continue; }
    files.push({ name: att[i].zipName, bytes: new Uint8Array(await data.arrayBuffer()) });
  }
  if (missing.length) throw new Error(`${missing.length} attachment(s) could not be downloaded (${missing.slice(0, 3).join(", ")}${missing.length > 3 ? "…" : ""}). Nothing was saved — try again.`);
  const base = PPRecord.fileBase(rec);
  files.unshift(
    { name: `exercise-report-${base}.txt`, bytes: enc.encode(PPRecord.buildText(rec, { exportedAt })) },
    { name: "exercise-record.json", bytes: enc.encode(JSON.stringify(PPRecord.publicJson(rec), null, 2) + "\n") });
  say("Checking every file…");
  for (const f of files) { f.size = f.bytes.length; f.sha256 = await sha256hex(f.bytes); }
  const entries = {};
  files.forEach((f) => { entries[f.name] = [f.bytes, { level: /\.(pdf|png|jpe?g|zip|docx|xlsx|pptx)$/i.test(f.name) ? 0 : 6 }]; });
  entries["manifest.txt"] = enc.encode(PPRecord.manifestText(rec, files, exportedAt));
  const zip = fflate.zipSync(entries, { mtime: new Date() });
  const back = fflate.unzipSync(zip);
  for (const f of files) {
    if (!back[f.name] || await sha256hex(back[f.name]) !== f.sha256) throw new Error(`The zip did not reopen correctly (${f.name}). Nothing was saved — try again.`);
  }
  if (!back["manifest.txt"]) throw new Error("The zip has no manifest. Nothing was saved — try again.");
  return { rec, zip, base, fingerprint: await sha256hex(zip), counts: PPRecord.counts(rec), files: files.length + 1 };
}
// Lists every stored file of this exercise (all runs), however deep.
async function listRecordFiles(prefix, bucket = RECORD_BUCKET) {
  const out = [];
  const { data, error } = await sb.storage.from(bucket).list(prefix, { limit: 1000 });
  if (error) throw error;
  for (const item of data || []) {
    const path = prefix + "/" + item.name;
    if (item.id == null) out.push(...await listRecordFiles(path, bucket)); else out.push(path);
  }
  return out;
}

// One line in step 4: "Voice and video: prepare → preparing (n of m) → ready →
// failed (Retry failed)". Prepare asks the background function
// /api/media-prepare to make the inject narration (Azure Speech) and the news
// clips (HeyGen presenter) days before the exercise; the room never calls
// either service. Progress is read from admin_media_status every 5 seconds.
const MEDIA_BUCKET = "exercise-media";
const MEDIA_USD_PER_CLIP = 4;
const MEDIA_STALE_MS = 17 * 60000; // a background run lasts at most 15 minutes
function mediaFacts(m) {
  const status = (m && m.status) || "none";
  const stale = status === "preparing" && m.updated_at && Date.now() - Date.parse(m.updated_at) > MEDIA_STALE_MS;
  const c = (m && m.counts) || { narration: 0, clips: 0 };
  const failedItems = [];
  for (const [k, it] of Object.entries((m && m.items) || {})) for (const [what, why] of Object.entries((it && it.failed) || {})) failedItems.push({ inject: Number(k) + 1, what, why });
  return { status: stale ? "stopped" : status, counts: c, progress: (m && m.progress) || null, failedItems,
    refused: (m && m.refused) || [], preparedAt: m && m.prepared_at };
}
function mediaWhat(key) {
  const [kind, lang] = String(key).split("_");
  return (kind === "clip" ? "news clip" : "narration") + (lang ? " (" + (lang === "ar" ? "Arabic" : "English") + ")" : "");
}
function mediaLineText(f) {
  const both = `${plural(f.counts.narration, "narration file")} · ${plural(f.counts.clips, "news clip")}`;
  if (f.status === "none") return ["Voice and video", " — not prepared yet. Prepare it a few days before the exercise (narration for each inject; news clips where the scenario has them)."];
  if (f.status === "preparing") return ["Voice and video", ` — preparing${f.progress ? ` (${f.progress.done} of ${f.progress.total})` : ""}… you can leave this page; it carries on by itself.`];
  if (f.status === "stopped") return ["Voice and video", " — the last run stopped before it finished. Press Retry failed."];
  if (f.status === "ready") return ["Voice and video", ` — ready (${both})${f.preparedAt ? ", " + dt(f.preparedAt) : ""}`];
  return ["Voice and video", ` — ${plural(f.failedItems.length || 1, "item")} failed (${both} ready). Press Retry failed.`];
}

async function startMediaPrepare(sessionId) {
  const { data } = await sb.auth.getSession();
